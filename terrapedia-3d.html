<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="TerraPedia — Modul ensiklopedia interaktif 3D: ekosistem prasejarah & lapisan interior Bumi dengan visualisasi WebGL." />
  <title>TerraPedia — Ekosistem Prasejarah &amp; Lapisan Interior Bumi (Modul 3D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* TerraPedia BAB 01 — arah: observatorium malam + atlas ilmiah.
       Chrome tenang: permukaan gelap bersih, hairline, satu aksen aurora.
       Kekayaan warna hanya hidup di diorama 3D. Signature: kelompeng skala. */
    :root{
      --tp-bg-deep:#050811;
      --surface:rgba(12,18,30,.92);
      --surface-2:rgba(17,24,40,.94);
      --tp-accent:#5df0a8;
      --tp-border:rgba(255,255,255,.08);
      --tp-border-strong:rgba(255,255,255,.16);
      --tp-text-main:#f1f5f9;
      --tp-text-body:#cbd5e1;
      --tp-text-muted:#94a3b8;
      --amber:#fbbf24;
      --shadow-float:0 12px 32px rgba(0,0,0,.38);
      --radius-lg:16px;
      --radius-md:12px;
      --radius-sm:8px;
      --font:'Inter',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}
    html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);color:var(--tp-text-main);background-color:var(--tp-bg-deep);-webkit-font-smoothing:antialiased;user-select:none}
    ::selection{background:rgba(93,240,168,.22);color:#fff}
    button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

    #canvas3d{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;cursor:grab;z-index:1;touch-action:none}
    #canvas3d.hover-target{cursor:pointer}
    #canvas3d:active{cursor:grabbing}

    .ui-shell{position:fixed;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column;justify-content:space-between;padding:16px}
    .top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

    .brand-pill{pointer-events:auto;display:inline-flex;align-items:center;gap:12px;padding:8px 14px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--tp-border);box-shadow:var(--shadow-float)}
    .brand-mark{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--tp-accent);font-size:12px;background:rgba(93,240,168,.1);border:1px solid rgba(93,240,168,.35);flex:none}
    .brand-col{display:flex;flex-direction:column;gap:4px;min-width:0}
    .brand-title{font-weight:600;font-size:13px;letter-spacing:-.01em;color:#fff;white-space:nowrap}
    .brand-sub{font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--tp-text-muted);white-space:nowrap}
    .brand-chapter{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--tp-text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .top-controls{pointer-events:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .cam-btn{padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--tp-text-body);background:var(--surface-2);border:1px solid var(--tp-border);transition:color .18s ease,background-color .18s ease,border-color .18s ease}
    .cam-btn:hover{color:#fff;background:rgba(255,255,255,.1);border-color:var(--tp-border-strong)}
    .cam-btn.active{color:var(--tp-accent);background:rgba(93,240,168,.12);border-color:rgba(93,240,168,.4)}

    .pill-group{display:inline-flex;gap:2px;padding:4px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--tp-border)}
    .pill-group button{padding:4px 10px;border-radius:6px;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--tp-text-muted);border:1px solid transparent;transition:color .18s ease,background-color .18s ease,border-color .18s ease}
    .pill-group button:hover{color:#fff}
    .pill-group button.active{color:var(--tp-accent);background:rgba(93,240,168,.12);border-color:rgba(93,240,168,.4)}

    .exit-btn{width:32px;height:32px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--surface-2);border:1px solid var(--tp-border);color:var(--tp-text-muted);transition:color .18s ease,background-color .18s ease,border-color .18s ease}
    .exit-btn:hover{color:#fda4af;background:rgba(244,63,94,.14);border-color:rgba(251,113,133,.35)}
    .exit-btn svg{width:15px;height:15px;display:block}

    .chapter-nav-row{display:flex;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--tp-border)}
    .chapter-next-card{display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:6px 8px 6px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,.04);border:1px solid var(--tp-border);text-decoration:none;transition:border-color .18s ease,background-color .18s ease}
    .chapter-next-card:hover{border-color:rgba(93,240,168,.4);background:rgba(93,240,168,.06)}
    .chapter-next-text{display:flex;flex-direction:column;gap:2px;align-items:flex-end;min-width:0}
    .chapter-next-label{font-family:var(--font-mono);font-size:9px;font-weight:400;color:var(--tp-text-muted);white-space:nowrap}
    .chapter-next-title{font-size:12px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .18s ease}
    .chapter-next-card:hover .chapter-next-title{color:var(--tp-accent)}
    .chapter-next-arrow{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px;line-height:1;color:var(--tp-text-muted);background:rgba(255,255,255,.05);border:1px solid var(--tp-border);transition:color .18s ease,background-color .18s ease,border-color .18s ease}
    .chapter-next-card:hover .chapter-next-arrow{color:var(--tp-accent);background:rgba(93,240,168,.14);border-color:rgba(93,240,168,.4)}

    .touch-prompt{align-self:center;margin-top:26px;padding:6px 14px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--tp-border);font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--tp-text-body);transition:opacity .3s ease,transform .3s ease,visibility .3s}
    .touch-prompt.hidden{opacity:0;transform:translateY(-6px);visibility:hidden}

    .info-popup{position:fixed;right:16px;top:96px;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 200px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--surface-2);border:1px solid var(--tp-border);border-radius:var(--radius-lg);padding:16px;padding-left:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-float);z-index:25;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px);transition:opacity .26s ease,transform .26s ease,visibility .26s;user-select:text}
    /* Signature: kelompeng skala di tepi kiri panel inspeksi */
    .info-popup::before{content:'';position:absolute;left:10px;top:16px;bottom:16px;width:5px;background-image:repeating-linear-gradient(to bottom,var(--tp-border-strong) 0 1px,transparent 1px 8px)}
    .info-popup.open{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}
    .info-popup.dino-mode{border-color:rgba(251,191,36,.35)}

    .info-header{display:flex;align-items:flex-start;gap:12px}
    .info-badge{width:40px;height:40px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;font-weight:500;background:rgba(93,240,168,.12);border:1px solid rgba(93,240,168,.4);color:var(--tp-accent);flex:none}
    .info-head-col{flex:1;min-width:0}
    .info-eyebrow{display:block;font-family:var(--font-mono);font-size:10px;color:var(--tp-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .info-title{font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.01em;color:#fff;margin-top:4px}
    .info-close{width:30px;height:30px;border-radius:var(--radius-sm);background:rgba(255,255,255,.05);border:1px solid var(--tp-border);color:var(--tp-text-muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;transition:color .18s ease,background-color .18s ease,border-color .18s ease}
    .info-close:hover{background:rgba(244,63,94,.14);border-color:rgba(251,113,133,.35);color:#fda4af}
    .info-desc{font-size:12.5px;line-height:1.6;color:var(--tp-text-body)}

    .metrics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .metric-card{padding:10px 12px;border-radius:var(--radius-md);background:rgba(255,255,255,.03);border:1px solid var(--tp-border)}
    .metric-lbl{font-family:var(--font-mono);font-size:9.5px;color:var(--tp-text-muted)}
    .metric-val{font-family:var(--font-mono);font-size:12.5px;font-weight:500;color:var(--tp-text-main);margin-top:4px}

    .sublayer-box{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--tp-border)}
    .panel-heading{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10px;color:var(--tp-text-muted)}
    .panel-heading::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
    .sublayer-item{padding:12px;border-radius:var(--radius-md);background:rgba(255,255,255,.03);border:1px solid var(--tp-border);transition:border-color .18s ease,background-color .18s ease}
    .sublayer-item:hover{border-color:var(--tp-border-strong);background:rgba(255,255,255,.05)}
    .sublayer-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:500;color:#fff;margin-bottom:4px}
    .sublayer-top span:last-child{font-family:var(--font-mono);font-size:10px;color:var(--tp-text-muted);text-align:right;white-space:nowrap;flex:none}
    .sublayer-p{font-size:11.5px;line-height:1.55;color:var(--tp-text-body)}
    .info-dismiss-hint{font-family:var(--font-mono);font-size:10px;color:var(--tp-text-muted);text-align:center;padding-top:8px;border-top:1px solid var(--tp-border)}

    .dino-mode .info-badge{color:var(--amber);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4)}
    .dino-mode .info-popup{background:var(--surface-2)}

    .bottom-dock{pointer-events:auto;align-self:center;width:min(840px,100%);min-width:0;max-width:100%;overflow:hidden;background:var(--surface);border:1px solid var(--tp-border);border-radius:var(--radius-lg);padding:12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-float)}
    .layer-pills{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none;-ms-overflow-style:none;padding:2px 2px 3px;cursor:grab}
    .layer-pills.dragging{cursor:grabbing}
    .layer-pills::-webkit-scrollbar{display:none;width:0;height:0}

    .layer-btn{flex:0 0 auto;touch-action:pan-x;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,.05);border:1px solid var(--tp-border);white-space:nowrap;font-size:12px;font-weight:500;color:var(--tp-text-body);transition:color .18s ease,background-color .18s ease,border-color .18s ease}
    .layer-btn:hover{color:#fff;background:rgba(255,255,255,.08);border-color:var(--tp-border-strong)}
    .layer-btn.active{color:var(--tp-accent);background:rgba(93,240,168,.12);border-color:rgba(93,240,168,.4)}
    .layer-btn.dino-pill.active{color:var(--amber);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4)}
    .swatch{width:8px;height:8px;border-radius:9999px;flex-shrink:0}

    .controls-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--tp-border)}
    .slider-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:160px}
    .slider-col{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
    .tick-row{height:5px;background-image:repeating-linear-gradient(to right,rgba(255,255,255,.16) 0 1px,transparent 1px 8px);background-size:calc(100% - 1px) 100%;background-repeat:no-repeat}
    .slider-lbl{font-family:var(--font-mono);font-size:10px;color:var(--tp-text-muted);white-space:nowrap}
    .slider-val{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--tp-accent);min-width:32px;text-align:right}
    .range-input{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:9999px;background:rgba(255,255,255,.08);outline:none;touch-action:pan-x}
    .range-input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:9999px;background:var(--tp-accent);border:2px solid var(--tp-bg-deep);cursor:pointer}
    .range-input::-moz-range-thumb{width:14px;height:14px;border-radius:9999px;background:var(--tp-accent);border:2px solid var(--tp-bg-deep);cursor:pointer}

    .toggle-row{display:flex;gap:6px}
    .mini-toggle{padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--tp-text-body);background:rgba(255,255,255,.05);border:1px solid var(--tp-border);transition:color .18s ease,background-color .18s ease,border-color .18s ease}
    .mini-toggle:hover{color:#fff;background:rgba(255,255,255,.1)}
    .mini-toggle.active{color:var(--tp-accent);background:rgba(93,240,168,.12);border-color:rgba(93,240,168,.4)}

    @media (max-width:720px){
      .brand-sub{display:none}
      .info-popup{left:12px;right:12px;top:58px;width:auto;max-height:46vh;padding-left:20px}
      .info-popup::before{left:6px}
      /* Shell & safe-area (perangkat berponi/notch) */
      .ui-shell{padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
      /* Bilah atas lebih ramping */
      .brand-pill{padding:6px 10px;gap:8px}
      .brand-mark{width:26px;height:26px;border-radius:8px}
      .brand-title{font-size:12px}
      .brand-chapter{font-size:9px}
      .cam-btn{padding:5px 9px;font-size:11px}
      .pill-group button{padding:4px 8px;font-size:10px}
      .exit-btn{width:30px;height:30px}
      .touch-prompt{font-size:10px;padding:5px 11px}
      /* Dock bawah lebih ringkas */
      .bottom-dock{padding:8px 12px;gap:6px}
      .layer-btn{padding:4px 9px;font-size:11px}
      .mini-toggle{padding:4px 8px;font-size:11px}
      .slider-wrap{min-width:120px;gap:8px}
      .slider-lbl{font-size:9px}
      .controls-row{gap:8px;padding-top:6px}
      .chapter-next-card{padding:5px 6px 5px 10px}
      .chapter-next-title{max-width:190px;font-size:11.5px}
      .chapter-next-arrow{width:22px;height:22px}
    }
    @media (max-width:380px){
      .top-controls{gap:4px}
      .cam-btn{padding:4px 7px;font-size:10.5px}
      .pill-group button{padding:4px 6px}
      .brand-chapter{max-width:150px}
      .chapter-next-title{max-width:140px;font-size:11px}
      .mini-toggle{padding:4px 6px;font-size:10.5px}
      .layer-btn{padding:4px 7px;font-size:10.5px}
      .info-popup{max-height:52vh;padding:12px;padding-left:20px}
      .info-popup::before{left:5px}
      .info-title{font-size:15.5px}
      .metric-card{padding:8px 10px}
    }
    @media (prefers-reduced-motion:reduce){
      .info-popup,.touch-prompt,.chapter-next-title{transition:none}
    }
  </style>
<style id="tpNavStyle">
    /* ====== TerraPedia NAV: bilah navigasi menjadi sidebar kiri penuh + tombol navbar ====== */
    :root{--tp-nav-w:min(280px,86vw)}
    .ui-shell .bottom-dock{
      position:fixed;top:0;bottom:0;left:0;z-index:30;
      width:var(--tp-nav-w);max-width:86vw;height:auto;max-height:none;
      border-width:0 1px 0 0;border-radius:0 18px 18px 0;
      overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
      padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px));
      transition:left .34s cubic-bezier(.22,.7,.2,1),visibility .34s;
    }
    html.nav-closed .ui-shell .bottom-dock{left:calc(-1 * var(--tp-nav-w));visibility:hidden}

    /* Tombol navbar (handle) menempel di tepi kanan sidebar */
    .nav-handle{position:fixed;top:50%;left:var(--tp-nav-w);transform:translateY(-50%);margin-left:-1px;z-index:41;width:26px;height:52px;display:inline-flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;color:var(--tp-text-muted);background:var(--surface);border:1px solid var(--tp-border);border-left:none;border-radius:0 12px 12px 0;box-shadow:6px 0 18px -10px rgba(0,0,0,.65);transition:left .34s cubic-bezier(.22,.7,.2,1),color .18s ease,background-color .18s ease}
    .nav-handle:hover{color:#fff;background:rgba(255,255,255,.1)}
    .nav-handle svg{width:14px;height:14px;pointer-events:none}
    .nav-handle .ic-open{display:none}
    html.nav-closed .nav-handle{left:0}
    html.nav-closed .nav-handle .ic-close{display:none}
    html.nav-closed .nav-handle .ic-open{display:block}
    .nav-handle:focus-visible{outline:2px solid rgba(93,240,168,.7);outline-offset:1px}

    /* Kartu navigasi bab: fixed di ujung kiri & kanan viewport (di luar dock) */
    .tp-nav-card{position:fixed;bottom:16px;z-index:40;pointer-events:auto;width:auto;max-width:min(330px,38vw)}
    .tp-nav-card.tp-card-next{right:16px;transition:opacity .25s ease,visibility .25s}
    .tp-nav-card.tp-card-prev{left:16px}

    /* HUD atas (brand & bar petunjuk) mengambang di atas sidebar — tidak pernah bergeser */
    .ui-shell .top-bar .brand-pill{position:relative;z-index:45}
    .ui-shell .touch-prompt{position:relative;z-index:45}
    /* (a) Label mengambang lapisan 3D (pola BAB 02) */
    #tp3dLabels{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
    .tp-layer-label{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:500;color:#f8fafc;background:rgba(8,14,26,.92);border:1px solid rgba(255,255,255,.16);box-shadow:var(--shadow-float);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;transform:translate(-50%,-50%);transition:border-color .18s ease,background-color .18s ease,color .18s ease}
    .tp-layer-label .tp-dot{width:8px;height:8px;border-radius:9999px;flex:none}
    .tp-layer-label .tp-num{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--tp-accent);flex:none}
    .tp-layer-label:hover{border-color:rgba(255,255,255,.35)}
    .tp-layer-label.active{color:var(--tp-accent);border-color:rgba(93,240,168,.5);background:rgba(93,240,168,.12)}

    /* (b) Ketinggian dock di desktop: isi naik, ruang kosong atas berkurang */
    @media (min-width:901px){
      .ui-shell .bottom-dock{padding-top:24px}
    }

    /* (e) Struktur item navbar seragam: lingkaran warna + nomor + nama */
    .tp-pill-dot{width:8px;height:8px;border-radius:9999px;flex:none;display:inline-block}
    .tp-pill-num{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--tp-text-muted,#94a3b8);flex:none}
    button.active .tp-pill-num{color:inherit}

    /* (d) Struktur floating text seragam: lingkaran warna + nomor + nama */
    .tp-f-dot{width:8px;height:8px;border-radius:9999px;flex:none;display:inline-block}
    .tp-f-num{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--tp-accent,#5df0a8);flex:none}

    /* Tagline di area atas dock navigasi */
    .tp-dock-tagline{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--tp-text-body,#cbd5e1);padding:0 2px 2px;white-space:nowrap}
    .tp-dock-tagline::before{content:'';width:6px;height:6px;border-radius:9999px;background:var(--tp-accent,#5df0a8);box-shadow:0 0 0 3px rgba(93,240,168,.14);flex:none}
    .tp-dock-tagline::after{content:'';height:1px;flex:1;min-width:12px;background:linear-gradient(90deg,rgba(93,240,168,.28),transparent)}

    /* Mobile: sidebar menjadi drawer overlay */

  <!-- Multi-CDN Three.js Loader (Automatic fallback across cdnjs -> unpkg -> jsdelivr) -->
  <script>
    (function loadThreeWithFallback() {
      const cdnUrls = [
        'https://cdnjs.cloudflare.com/ajax/libs/three.js/r143/three.min.js',
        'https://unpkg.com/three@0.143.0/build/three.min.js',
        'https://cdn.jsdelivr.net/npm/three@0.143.0/build/three.min.js'
      ];
      let idx = 0;
      function tryNext() {
        if (window.THREE) {
          window.initTerraPedia3D();
          return;
        }
        if (idx >= cdnUrls.length) return;
        const s = document.createElement('script');
        s.src = cdnUrls[idx++];
        s.onload = () => {
          if (window.THREE) window.initTerraPedia3D();
          else tryNext();
        };
        s.onerror = tryNext;
        document.head.appendChild(s);
      }
      tryNext();
    })();
  </script>

  <script>
    window.initTerraPedia3D = function () {
      const THREE = window.THREE;
      if (!THREE) return;

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
      const wrapAngle = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
      const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); };
      function valueNoise(x, y) {
        const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
        const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
        return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), u), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), u), v) * 2 - 1;
      }
      function fbm2(x, y, oct = 4) {
        let val = 0, amp = 0.5, freq = 1;
        for (let i = 0; i < oct; i++) { val += amp * valueNoise(x * freq, y * freq); freq *= 2.04; amp *= 0.5; }
        return val;
      }
      function ridgedNoise(x, y) {
        let val = 0, amp = 0.5, freq = 1;
        for (let i = 0; i < 4; i++) { const n = 1 - Math.abs(valueNoise(x * freq, y * freq)); val += amp * n * n; freq *= 2.1; amp *= 0.5; }
        return val;
      }
      function fbm(x, y, z) {
        let v = 0, amp = 0.5, freq = 1;
        for (let i = 0; i < 4; i++) { v += amp * (Math.sin(x * freq * 2.1 + Math.cos(z * freq * 1.9)) * Math.cos(y * freq * 2.3 + x * freq)); freq *= 2.08; amp *= 0.5; }
        return v;
      }
      function distToBezier(px, pz, ax, az, bx, bz, cx, cz) {
        let minD = 1e9, prevX = ax, prevZ = az;
        for (let i = 1; i <= 18; i++) {
          const t = i / 18, inv = 1 - t;
          const qx = inv * inv * ax + 2 * inv * t * bx + t * t * cx;
          const qz = inv * inv * az + 2 * inv * t * bz + t * t * cz;
          const vx = qx - prevX, vz = qz - prevZ, wx = px - prevX, wz = pz - prevZ;
          const u = clamp((wx * vx + wz * vz) / (vx * vx + vz * vz + 1e-8), 0, 1);
          const d = Math.hypot(px - (prevX + u * vx), pz - (prevZ + u * vz));
          if (d < minD) minD = d;
          prevX = qx; prevZ = qz;
        }
        return minD;
      }

      // Built-in Damped 360° Orbit & Touch Pinch Camera Controller (Zero external module dependency)
      function createOrbitController(cam, domEl) {
        const target = new THREE.Vector3(0, 0.1, 0);
        const spherical = new THREE.Spherical();
        const sphericalDelta = new THREE.Spherical();
        const offset = new THREE.Vector3();
        let scale = 1;
        let isDragging = false;
        let prevX = 0, prevY = 0, prevPinchDist = 0;
        const startListeners = [];
        const activePointers = new Map();

        const ctrl = {
          target,
          minDistance: 0.85,
          maxDistance: 15,
          dampingFactor: 0.08,
          addEventListener(type, fn) { if (type === 'start') startListeners.push(fn); },
          update() {
            offset.copy(cam.position).sub(target);
            spherical.setFromVector3(offset);
            spherical.theta += sphericalDelta.theta;
            spherical.phi += sphericalDelta.phi;
            spherical.phi = clamp(spherical.phi, 0.08, Math.PI - 0.08);
            spherical.radius = clamp(spherical.radius * scale, ctrl.minDistance, ctrl.maxDistance);
            offset.setFromSpherical(spherical);
            cam.position.copy(target).add(offset);
            cam.lookAt(target);
            sphericalDelta.theta *= (1 - ctrl.dampingFactor);
            sphericalDelta.phi *= (1 - ctrl.dampingFactor);
            scale = 1;
          }
        };

        const notifyStart = () => startListeners.forEach(fn => fn());

        domEl.addEventListener('pointerdown', (e) => {
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (activePointers.size === 1) {
            isDragging = true;
            prevX = e.clientX;
            prevY = e.clientY;
          } else if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            prevPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          }
        });

        window.addEventListener('pointermove', (e) => {
          if (!activePointers.has(e.pointerId)) return;
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            if (prevPinchDist > 0 && dist > 0) {
              notifyStart();
              scale *= prevPinchDist / dist;
            }
            prevPinchDist = dist;
          } else if (isDragging && activePointers.size === 1) {
            const dx = e.clientX - prevX;
            const dy = e.clientY - prevY;
            if (Math.hypot(dx, dy) > 2) notifyStart();
            sphericalDelta.theta -= (2 * Math.PI * dx / Math.max(domEl.clientHeight, 300)) * 0.65;
            sphericalDelta.phi   -= (2 * Math.PI * dy / Math.max(domEl.clientHeight, 300)) * 0.65;
            prevX = e.clientX;
            prevY = e.clientY;
          }
        });

        const endPointer = (e) => {
          activePointers.delete(e.pointerId);
          if (activePointers.size < 2) prevPinchDist = 0;
          if (activePointers.size === 0) isDragging = false;
        };
        window.addEventListener('pointerup', endPointer);
        window.addEventListener('pointercancel', endPointer);

        domEl.addEventListener('wheel', (e) => {
          e.preventDefault();
          notifyStart();
          scale *= e.deltaY > 0 ? 1.08 : 0.92;
        }, { passive: false });

        return ctrl;
      }

      const LAYER_ORDER = ['crust', 'litho', 'mantle', 'outerCore', 'innerCore'];
      const DINO_ORDER  = ['trex', 'brachio', 'trice', 'stego', 'mosa', 'ptero'];

        mantle:    { baseY:  0.28, dist: 4.20, elev: 0.14 },
        outerCore: { baseY: -1.06, dist: 3.35, elev: 0.16 },
        innerCore: { baseY: -2.09, dist: 2.85, elev: 0.20 }

        trex: {
          color: '#ef4444', icon: '🦖',
          id: {
            shortName: 'T-Rex', eyebrow: 'Fauna Prasejarah · Theropoda Predator Puncak', title: 'Tyrannosaurus rex',
            desc: 'Predator darat paling ikonik di pengujung Zaman Kapur yang mendominasi rantai makanan Amerika Utara dengan gigitan penghancur tulang dan indra penciuman tajam.',
            metrics: [{ l: 'Diet Utama', v: 'Karnivora Puncak' }, { l: 'Periode Hidup', v: 'Kapur Akhir (68 Jtl)' }, { l: 'Panjang & Berat', v: '12,5 m · 8,5 Ton' }, { l: 'Lokasi Fosil', v: 'Amerika Utara' }],
            subHeading: '6 Profil Lengkap Spesies Dinosaurus',
            subs: [
              { n: '1. Nama & Arti Nama', m: 'Tyrannosaurus rex', d: 'Nama ilmiah lengkapnya adalah Tyrannosaurus rex, yang secara harfiah berarti "Raja Kadal Tiran" (Tyranno = tiran, saurus = kadal, rex = raja).' },
              { n: '2. Jenis Makanan (Diet)', m: 'Karnivora (Pemakan Daging)', d: 'Karnivora puncak pemakan daging yang memburu herbivora besar seperti Triceratops dan Edmontosaurus, sekaligus pemakan bangkai.' },
              { n: '3. Periode Hidup & Lokasi', m: 'Zaman Kapur Akhir', d: 'Hidup sekitar 68 hingga 66 juta tahun lalu dan fosilnya banyak ditemukan di wilayah benua Amerika Utara bagian barat (AS & Kanada).' },
              { n: '4. Estimasi Ukuran', m: 'Setara Bus Sekolah', d: 'Panjang tubuh 12–13 meter, tinggi pinggul 3,8 meter, dan berat 8–9 ton—panjangnya setara satu bus sekolah besar dan beratnya menyamai gabungan 6 mobil SUV.' },
              { n: '5. Ciri Fisik Utama', m: 'Rahang & Gigi Pisang', d: 'Memiliki tengkorak kokoh sepanjang 1,5 meter dengan 60 gigi bergerigi seukuran pisang yang menghasilkan gigitan 35.000+ Newton (mampu meremukkan tulang).' },

          e.stopPropagation();
          if (e.pointerType === 'mouse') {
            dragActive = true; dragged = false; startX = e.clientX; startScroll = barEl.scrollLeft;
            barEl.classList.add('dragging');
          } else {
            dragged = false; startX = e.clientX;

        window.addEventListener('pointermove', (e) => {
          if (!dragActive) return;
          const dx = e.clientX - startX;
          if (Math.abs(dx) > 5) dragged = true;
          barEl.scrollLeft = startScroll - dx;
        });
        window.addEventListener('pointerup', () => {
          if (dragActive) { dragActive = false; barEl.classList.remove('dragging'); }
        });
        barEl.addEventListener('wheel', (e) => {
          e.stopPropagation();
          if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            e.preventDefault();
            barEl.scrollLeft += e.deltaY;
          }
        }, { passive: false });
        return () => { const d = dragged; dragged = false; return d; };

      `;

      const wedgeRoot = new THREE.Group();
      wedgeRoot.position.y = 0.22;
      scene.add(wedgeRoot);

      const layerGroups = { crust: new THREE.Group(), litho: new THREE.Group(), mantle: new THREE.Group(), outerCore: new THREE.Group(), innerCore: new THREE.Group() };
      const pickableMeshes = [];
      const dinoPickMeshes = [];
      const highlightUniforms = {};
      Object.entries(layerGroups).forEach(([k, g]) => { g.userData.layerKey = k; highlightUniforms[k] = { value: 0 }; wedgeRoot.add(g); });
      const regPick = (m, k) => { m.userData.layerKey = k; pickableMeshes.push(m); };

      const hitboxMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
      function regDinoPick(rootGrp, dinoKey, hitRadius = 0.13) {
        const hitSphere = new THREE.Mesh(new THREE.SphereGeometry(hitRadius, 10, 10), hitboxMat);
        hitSphere.position.set(0, hitRadius * 0.45, 0);
        rootGrp.add(hitSphere);
        rootGrp.traverse(c => {
          if (c.isMesh) {
            c.userData.dinoKey = dinoKey;
            dinoPickMeshes.push(c);
          }
        });
      }

      const R_DISC = 2.20, R_CRUST_BOT = 2.05, VOLC_X = 0.02, VOLC_Z = 0.02;
      const RIVER_SEGS = [
        { ax: 0.02, az: -0.08, bx: -0.03, bz: -0.45, cx: 0.14, cz: -0.86, w: 0.022 },
        { ax: 0.04, az: -0.48, bx: 0.12, bz: -0.64, cx: 0.14, cz: -0.86, w: 0.016 },
        { ax: 0.12, az: -0.06, bx: 0.28, bz: -0.36, cx: 0.68, cz: -0.46, w: 0.019 },
        { ax: -0.14, az: 0.02, bx: -0.42, bz: -0.06, cx: -0.76, cz: -0.26, w: 0.022 },
        { ax: -0.08, az: 0.16, bx: -0.18, bz: 0.34, cx: -0.32, cz: 0.52, w: 0.016 },
        { ax: 0.14, az: 0.14, bx: 0.32, bz: 0.42, cx: 0.34, cz: 0.78, w: 0.021 },
        { ax: 0.22, az: 0.08, bx: 0.58, bz: 0.18, cx: 0.96, cz: 0.08, w: 0.021 }
      ];
      const MTN_PEAKS = [
        [0.62, -0.26, 0.20, 0.35], [0.74, -0.30, 0.19, 0.38], [0.70, -0.10, 0.19, 0.32],
        [0.78,  0.28, 0.23, 0.38], [0.68,  0.46, 0.24, 0.42], [0.56,  0.62, 0.22, 0.36],
        [-0.78, 0.34, 0.20, 0.24]
      ];

      function evalSurf(nx, nz) {
        const r = Math.hypot(nx, nz), ang = Math.atan2(nz, nx);
        const nLow = fbm2(nx * 3.2 + 1.7, nz * 3.2 - 0.8, 4), nMed = fbm2(nx * 7.5 - 2.1, nz * 7.5 + 1.4, 4), nHigh = fbm2(nx * 18, nz * 18, 3);
        const mainCoast = 0.74 + 0.16 * Math.cos(ang - 0.2) + 0.14 * Math.sin(ang - 1.2) + 0.10 * Math.cos(ang * 2 + 0.8) - 0.15 * Math.exp(-Math.pow(ang - Math.PI, 2) / 0.45) + 0.08 * nLow;
        const northDelta = Math.exp(-Math.pow((nx - 0.24) / 0.36, 2) - Math.pow((nz + 0.82) / 0.28, 2)) * 0.45;
        const eastReach = Math.exp(-Math.pow((nx - 0.72) / 0.38, 2) - Math.pow((nz - 0.18) / 0.68, 2)) * 0.42;
        const nwPen = Math.exp(-Math.pow((nx + 0.46) / 0.22, 2) - Math.pow((nz + 0.48) / 0.20, 2)) * 0.32;
        const sSpit = Math.exp(-Math.pow((nx - 0.02) / 0.26, 2) - Math.pow((nz - 0.76) / 0.16, 2)) * 0.30;
        const swIsl = Math.exp(-Math.pow((nx + 0.74) / 0.22, 2) - Math.pow((nz - 0.36) / 0.24, 2)) * 0.42;
        let landVal = Math.max((mainCoast + northDelta + eastReach + nwPen + sSpit - r) * 4.2, (swIsl - 0.16) * 4.5);
        landVal -= Math.exp(-Math.pow((nx - 0.36) / 0.11, 2) - Math.pow((nz + 0.62) / 0.08, 2)) * 1.45 + Math.exp(-Math.pow((nx - 0.02) / 0.13, 2) - Math.pow((nz - 0.68) / 0.08, 2)) * 1.15;
        const landMask = smoothstep(-0.08, 0.12, landVal);

        let minRD = 1e9, rW = 0.018;
        for (let i = 0; i < RIVER_SEGS.length; i++) {
          const sg = RIVER_SEGS[i], d = distToBezier(nx, nz, sg.ax, sg.az, sg.bx, sg.bz, sg.cx, sg.cz) + nMed * 0.005;
          if (d < minRD) { minRD = d; rW = sg.w; }
        }
        const dVolc = Math.hypot(nx - VOLC_X, nz - VOLC_Z);
        const riverWater = smoothstep(rW, rW * 0.38, minRD) * smoothstep(0.14, 0.22, dVolc);
        const riverBank = smoothstep(rW * 2.8, rW * 0.9, minRD) * smoothstep(0.14, 0.22, dVolc);

        const vx = nx - VOLC_X, vz = nz - VOLC_Z, vr = Math.hypot(vx, vz), vAng = Math.atan2(vz, vx);
        const vRad = 0.26 + 0.018 * Math.sin(vAng * 5) + 0.012 * Math.cos(vAng * 9) + nMed * 0.012;
        const vCone = clamp(1 - vr / vRad, 0, 1);
        const vGullies = ridgedNoise(vx * 9.5 + 3.1, vz * 9.5 - 1.4) * 0.18 + Math.sin(vAng * 16 + nMed * 2.5) * 0.04;
        const craterMask = smoothstep(0.070, 0.024, Math.hypot(vx + 0.012, vz + 0.010));
        const volcanoH = Math.pow(vCone, 1.42) * 0.56 + vCone * (1 - vCone) * vGullies - craterMask * 0.21;

        let mtnH = 0;
        const ridgeDetail = ridgedNoise(nx * 10.5, nz * 10.5) * 0.65 + (nHigh * 0.5 + 0.5) * 0.35;
        for (let i = 0; i < MTN_PEAKS.length; i++) {
          const [mx, mz, mr, mh] = MTN_PEAKS[i], md = Math.hypot(nx - mx, nz - mz);
          if (md < mr) mtnH = Math.max(mtnH, Math.pow(1 - md / mr, 1.65) * mh * (0.52 + 0.68 * ridgeDetail));
        }
        const height = landMask > 0.001 ? Math.max(0.002, (0.025 + 0.045 * smoothstep(0, 0.5, landMask) + nLow * 0.015 + volcanoH + mtnH) * landMask - riverWater * 0.028 * landMask) : 0;
        return { landVal, landMask, riverWater, riverBank, vCone, vGullies, craterMask, mtnH, ridgeDetail, nLow, nMed, nHigh, height };
      }

      function buildTopTextures() {
        const size = 768;
        const cCnv = document.createElement('canvas'); cCnv.width = cCnv.height = size;
        const cCtx = cCnv.getContext('2d'), cImg = cCtx.createImageData(size, size), cD = cImg.data;
        const mCnv = document.createElement('canvas'); mCnv.width = mCnv.height = size;
        const mCtx = mCnv.getContext('2d'), mImg = mCtx.createImageData(size, size), mD = mImg.data;

        for (let py = 0; py < size; py++) {
          const nz = (py / (size - 1)) * 2 - 1;
          for (let px = 0; px < size; px++) {
            const nx = (px / (size - 1)) * 2 - 1, s = evalSurf(nx, nz);
            let rC = 18, gC = 108, bC = 158, oM = 0, rvM = 0, shM = 0, lvM = s.craterMask;
            if (s.landMask < 0.5) {
              oM = 1 - s.landMask * 2; shM = smoothstep(-0.38, 0.06, s.landVal);
              const ws = Math.sin(nx * 14 + nz * 11 + s.nLow * 4.5) * 0.5 + 0.5;
              rC = lerp(14, 52, shM) + ws * 8; gC = lerp(96, 152, shM) + ws * 12; bC = lerp(144, 182, shM) + ws * 10;
            } else {
              const gt = clamp(0.5 + s.nMed * 0.45 + s.nHigh * 0.2, 0, 1);
              rC = lerp(84, 122, gt); gC = lerp(118, 148, gt); bC = lerp(42, 58, gt);
              const sw = clamp(Math.max(smoothstep(-0.25, -0.62, nz) * smoothstep(-0.15, 0.25, nx) * 0.92, smoothstep(0.48, 0.20, Math.hypot(nx - 0.04, nz + 0.06)) * 0.58, smoothstep(0.32, 0.02, s.landVal) * 0.85, s.riverBank * 0.78), 0, 1);
              rC = lerp(rC, 194 + s.nHigh * 14, sw); gC = lerp(gC, 166 + s.nHigh * 12, sw); bC = lerp(bC, 116 + s.nHigh * 10, sw);
              if (s.riverWater > 0.05) {
                rvM = s.riverWater;
                const be = smoothstep(0.05, 0.35, s.riverWater) * (1 - smoothstep(0.35, 0.68, s.riverWater));
                rC = lerp(rC, 34, s.riverWater) * (1 - be * 0.42); gC = lerp(gC, 140, s.riverWater) * (1 - be * 0.38); bC = lerp(bC, 195, s.riverWater) * (1 - be * 0.30);
              }
              if (s.mtnH > 0.025) {
                const mw = smoothstep(0.025, 0.09, s.mtnH), snw = smoothstep(0.13, 0.26, s.mtnH + s.nHigh * 0.03), crv = smoothstep(0.32, 0.58, s.ridgeDetail);
                rC = lerp(rC, lerp(lerp(88, 152, crv), 228, snw), mw); gC = lerp(gC, lerp(lerp(94, 158, crv), 234, snw), mw); bC = lerp(bC, lerp(lerp(96, 162, crv), 238, snw), mw);
              }
              if (s.vCone > 0.04) {
                const vw = smoothstep(0.04, 0.22, s.vCone), ab = smoothstep(0.18, 0.72, s.vCone + s.vGullies * 0.65), st = 0.72 + 0.28 * smoothstep(-0.04, 0.06, s.vGullies);
                if (s.vCone > 0.55 && s.vGullies < -0.015) lvM = Math.max(lvM, smoothstep(0.55, 0.85, s.vCone) * 0.65);
                rC = lerp(rC, lerp(112, 212, ab) * st, vw); gC = lerp(gC, lerp(110, 214, ab) * st, vw); bC = lerp(bC, lerp(104, 210, ab) * st, vw);
              }
              if (s.craterMask > 0.01) { rC = lerp(rC, 35, s.craterMask); gC = lerp(gC, 18, s.craterMask); bC = lerp(bC, 14, s.craterMask); }
            }
            const idx = (py * size + px) * 4;
            cD[idx] = clamp(Math.round(rC), 0, 255); cD[idx + 1] = clamp(Math.round(gC), 0, 255); cD[idx + 2] = clamp(Math.round(bC), 0, 255); cD[idx + 3] = 255;
            mD[idx] = clamp(Math.round(oM * 255), 0, 255); mD[idx + 1] = clamp(Math.round(rvM * 255), 0, 255); mD[idx + 2] = clamp(Math.round(shM * 255), 0, 255); mD[idx + 3] = clamp(Math.round(lvM * 255), 0, 255);
          }
        }
        cCtx.putImageData(cImg, 0, 0); mCtx.putImageData(mImg, 0, 0);
        const colorTex = new THREE.CanvasTexture(cCnv); colorTex.encoding = THREE.sRGBEncoding; colorTex.needsUpdate = true;
        const maskTex = new THREE.CanvasTexture(mCnv); maskTex.needsUpdate = true;
        return { colorTex, maskTex };
      }

      const crustBotWave = (ang) => Math.sin(ang * 10) * 0.032 + Math.cos(ang * 17) * 0.018;

      // 1. CRUST LAYER + INTERACTIVE VOLCANO ERUPTION SYSTEM
      let volcanoHitMesh = null;
      let eruptBoost = 0;
      const lavaBombs = [];
      const eruptSparks = [];
      let eruptSparkGeo = null;
      let eruptSparkPosArr = null;
      let eruptSparkMat = null;
      let craterLight = null;
      let craterPulseRing = null;
      let craterPulseMat = null;
      let craterPulseAge = 99;
      const UP_AXIS = new THREE.Vector3(0, 1, 0);
      const tempVelDir = new THREE.Vector3();

      {
        const { colorTex, maskTex } = buildTopTextures();
        const radSegs = 180, rngSegs = 104;
        const topGeo = new THREE.RingGeometry(0.0005, R_DISC, radSegs, rngSegs);
        topGeo.rotateX(-Math.PI / 2);
        const tP = topGeo.attributes.position, tU = topGeo.attributes.uv;
        for (let i = 0; i < tP.count; i++) {
          const x = tP.getX(i), z = tP.getZ(i), nx = clamp(x / R_DISC, -1, 1), nz = clamp(z / R_DISC, -1, 1);
          tP.setY(i, evalSurf(nx, nz).height);
          tU.setXY(i, 0.5 + nx * 0.5, 0.5 - nz * 0.5);
        }
        topGeo.computeVertexNormals();

        const topMat = new THREE.ShaderMaterial({
          uniforms: {
            uMap: { value: colorTex },
            uMask: { value: maskTex },
            uTime: { value: 0 },
            uErupt: { value: 0 },
            uHighlight: highlightUniforms.crust,
            uSun: { value: new THREE.Vector3(0.45, 0.85, 0.45).normalize() }
          },
          vertexShader: `
            uniform sampler2D uMask; uniform float uTime; varying vec2 vUv; varying vec3 vNorm; varying vec3 vPos;
            void main(){
              vUv = uv; vec3 p = position; float oM = texture2D(uMask, uv).r;
              if(oM > 0.1){ p.y += (sin(p.x*5.5+uTime*2.4)*cos(p.z*5.0-uTime*1.9)*0.012 + sin(length(p.xz)*9.0-uTime*3.0)*0.008)*oM; }
              vPos = p; vNorm = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D uMap; uniform sampler2D uMask; uniform float uTime; uniform float uErupt; uniform float uHighlight; uniform vec3 uSun;
            varying vec2 vUv; varying vec3 vNorm; varying vec3 vPos;
            ${SHADER_NOISE}
            void main(){
              vec3 col = texture2D(uMap, vUv).rgb * (max(dot(normalize(vNorm), uSun), 0.0)*0.52 + 0.52);
              vec4 mk = texture2D(uMask, vUv);
              if(mk.r > 0.05){
                float wn = fbm3(vec3(vPos.xz*4.2 + vec2(uTime*0.28,-uTime*0.22), uTime*0.45));
                col += vec3(0.08,0.28,0.38)*smoothstep(0.18,0.62,wn)*mk.r*0.55;
                col += vec3(0.45,0.85,1.0)*pow(clamp(sin(vPos.x*18.0+uTime*3.5)*cos(vPos.z*18.0-uTime*2.8),0.0,1.0),6.0)*mk.r*0.35;
                if(mk.b > 0.15){
                  float fm = smoothstep(0.62,0.92,sin(mk.b*22.0+uTime*3.4+wn*2.5))*smoothstep(0.15,0.85,mk.b);
                  col = mix(col, vec3(0.88,0.96,1.0), fm*0.72*mk.r);
                }
              }
              if(mk.g > 0.05){
                float d = length(vPos.xz - vec2(0.04,0.04));
                float sp = smoothstep(0.58,0.92, sin(d*26.0 - uTime*6.5 + snoise(vec3(vPos.xz*10.0,uTime*1.4))*2.5)*0.5+0.5);
                col = mix(col, vec3(0.48,0.88,1.0), sp*mk.g*0.68);
              }
              if(mk.a > 0.04){
                float bl = fbm3(vec3(vPos.xz*18.0, uTime*(2.2 + uErupt*4.0)));
                float pl = 0.5+0.5*sin(uTime*(4.2 + uErupt*8.0)+bl*3.0);
                vec3 lc = mix(vec3(0.22,0.04,0.01), vec3(0.98,0.22,0.02), smoothstep(-0.35,0.25,bl+pl*0.35 + uErupt*0.35));
                lc = mix(lc, vec3(1.0,0.88,0.32), smoothstep(0.28,0.78,bl+pl*0.4 + uErupt*0.45));
                col = mix(col, lc, smoothstep(0.04,0.45,mk.a));
              }
              col *= 0.72 + 0.28*smoothstep(2.20, 2.15, length(vPos.xz));
              col += vec3(0.25,0.95,0.65)*uHighlight*0.28;
              gl_FragColor = vec4(col, 1.0);
            }
          `
        });
        const topMesh = new THREE.Mesh(topGeo, topMat); topMesh.position.y = 1.85;
        layerGroups.crust.add(topMesh); regPick(topMesh, 'crust');
        layerGroups.crust.userData.topDiscMat = topMat;

        const volcHitGeo = new THREE.ConeGeometry(0.60, 0.58, 24);
        volcHitMesh = new THREE.Mesh(volcHitGeo, hitboxMat);
        volcHitMesh.position.set(VOLC_X * R_DISC, 1.85 + 0.27, VOLC_Z * R_DISC);
        layerGroups.crust.add(volcHitMesh);

        craterLight = new THREE.PointLight(0xff6a00, 0.5, 2.8);
        craterLight.position.set(VOLC_X * R_DISC, 2.42, VOLC_Z * R_DISC);
        layerGroups.crust.add(craterLight);

        const cpGeo = new THREE.RingGeometry(0.04, 0.08, 28);
        cpGeo.rotateX(-Math.PI / 2);
        craterPulseMat = new THREE.MeshBasicMaterial({ color: 0xffaa33, side: THREE.DoubleSide, transparent: true, opacity: 0, depthWrite: false });
        craterPulseRing = new THREE.Mesh(cpGeo, craterPulseMat);
        craterPulseRing.position.set(VOLC_X * R_DISC, 2.28, VOLC_Z * R_DISC);
        layerGroups.crust.add(craterPulseRing);

        const bombGeo = new THREE.IcosahedronGeometry(0.024, 1);
        for (let i = 0; i < 36; i++) {
          const bMat = new THREE.MeshBasicMaterial({ color: 0xffcc33 });
          const bMesh = new THREE.Mesh(bombGeo, bMat);
          bMesh.visible = false;
          layerGroups.crust.add(bMesh);
          lavaBombs.push({
            mesh: bMesh, mat: bMat, active: false,
            age: 0, life: 1.6,
            x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, baseScale: 1
          });
        }

        const spCnt = 80;
        eruptSparkGeo = new THREE.BufferGeometry();
        eruptSparkPosArr = new Float32Array(spCnt * 3);
        for (let i = 0; i < spCnt; i++) {
          eruptSparkPosArr[i * 3 + 1] = -999;
          eruptSparks.push({ active: false, age: 0, life: 1.2, x: 0, y: -999, z: 0, vx: 0, vy: 0, vz: 0 });
        }
        eruptSparkGeo.setAttribute('position', new THREE.BufferAttribute(eruptSparkPosArr, 3));
        eruptSparkMat = new THREE.PointsMaterial({
          color: 0xffdd55, size: 0.055, transparent: true, opacity: 0.95,
          blending: THREE.AdditiveBlending, depthWrite: false
        });
        const sparkPoints = new THREE.Points(eruptSparkGeo, eruptSparkMat);
        sparkPoints.frustumCulled = false;
        layerGroups.crust.add(sparkPoints);

        // Cliff Wall
        const wallGeo = new THREE.CylinderGeometry(R_DISC, R_CRUST_BOT, 0.40, radSegs, 24, true);
        const wP = wallGeo.attributes.position;
        for (let i = 0; i < wP.count; i++) {
          let x = wP.getX(i), y = wP.getY(i), z = wP.getZ(i);
          const r = Math.hypot(x, z), ang = Math.atan2(z, x), tf = clamp((y + 0.20) / 0.40, 0, 1);
          const rH = evalSurf(Math.cos(ang) * 0.985, Math.sin(ang) * 0.985).height;
          y = y > 0.17 ? 0.20 + rH : y + tf * rH + (1 - tf) * crustBotWave(ang);
          const s = (r + (Math.sin(ang * 16 + y * 6) * 0.022 + fbm(x * 2.5, y * 4, z * 2.5) * 0.025) * Math.sin(tf * Math.PI)) / r;
          wP.setXYZ(i, x * s, y, z * s);
        }
        wallGeo.computeVertexNormals();

        const wallMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uHighlight: highlightUniforms.crust, uSun: { value: new THREE.Vector3(0.55, 0.78, 0.55).normalize() } },
          vertexShader: `varying vec3 vPos; varying vec3 vNorm; void main(){vPos=position;vNorm=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
          fragmentShader: `
            uniform float uTime; uniform float uHighlight; uniform vec3 uSun; varying vec3 vPos; varying vec3 vNorm;
            ${SHADER_NOISE}
            void main(){
              float ang = atan(vPos.z, vPos.x), gr = fbm3(vPos*14.0), st = sin(vPos.y*32.0+fbm3(vPos*4.5)*2.5);
              vec3 col = mix(vec3(0.28,0.20,0.15), vec3(0.54,0.39,0.28), smoothstep(-0.65,0.15,gr+st*0.3));
              col = mix(col, vec3(0.76,0.60,0.45), smoothstep(0.15,0.75,gr+st*0.25));
              col = mix(col, vec3(0.52,0.53,0.52), smoothstep(0.2,0.8,cos(ang-0.5))*0.55*smoothstep(-0.2,0.5,gr));
              col *= 0.62 + 0.38*smoothstep(0.02,0.22,abs(snoise(vec3(ang*18.0,vPos.y*5.5,1.0))));
              float wf = clamp(exp(-pow(ang-2.15,2.0)/0.016)+exp(-pow(ang+2.65,2.0)/0.012),0.0,1.0);
              float wMask = clamp(max(smoothstep(0.13,0.19,vPos.y)*smoothstep(0.23,0.205,vPos.y)*smoothstep(-0.3,0.4,-cos(ang-0.3)), wf*0.96),0.0,1.0);
              float fs = snoise(vec3(ang*48.0, vPos.y*22.0+uTime*7.5, uTime*0.8));
              vec3 wCol = mix(mix(vec3(0.06,0.42,0.68),vec3(0.24,0.70,0.92),smoothstep(-0.3,0.4,fs)), vec3(0.92,0.98,1.0), clamp(smoothstep(0.35,0.8,fs)*wf*0.65 + smoothstep(-0.08,-0.19,vPos.y)*wf*(0.6+0.4*sin(uTime*9.0+ang*30.0)),0.0,1.0));
              col = mix(col, wCol, wMask) * (max(dot(normalize(vNorm),uSun),0.0)*0.62+0.42) + vec3(0.25,0.95,0.65)*uHighlight*0.28;
              gl_FragColor = vec4(col, 1.0);
            }
          `
        });
        const wallMesh = new THREE.Mesh(wallGeo, wallMat); wallMesh.position.y = 1.65;
        layerGroups.crust.add(wallMesh); regPick(wallMesh, 'crust');
        layerGroups.crust.userData.cliffWallMat = wallMat;

        // Solid Underside Bedrock Cap
        const uCapGeo = new THREE.RingGeometry(0.0005, R_CRUST_BOT, radSegs, 36);
        uCapGeo.rotateX(Math.PI / 2);
        const uP = uCapGeo.attributes.position;
        for (let i = 0; i < uP.count; i++) {
          const x = uP.getX(i), z = uP.getZ(i), r = Math.hypot(x, z), er = clamp(r / R_CRUST_BOT, 0, 1);
          uP.setY(i, crustBotWave(Math.atan2(z, x)) * Math.pow(er, 1.5) + fbm(x * 3, 0, z * 3) * 0.025 * (1 - er));
        }
        uCapGeo.computeVertexNormals();

        const uCapMat = new THREE.ShaderMaterial({
          side: THREE.DoubleSide,

      function triggerVolcanoEruption() {

          const b = lavaBombs[i];
          if (!b.active) {
            b.active = true;
            b.age = 0;
            b.life = 1.45 + Math.random() * 0.55;
            const ang = Math.random() * Math.PI * 2;
            const offR = Math.random() * 0.045;

            b.y = cy;
            b.z = cz + Math.sin(ang) * offR;

            b.vz = Math.sin(ang) * outSpd;

            const ang = Math.random() * Math.PI * 2;

        const flippers = [], flipGeo = new THREE.BoxGeometry(0.065, 0.005, 0.026);
        [[0.028,-0.008,0.032,1.0,0.35],[-0.028,-0.008,0.032,-1.0,0.35],[0.022,-0.008,-0.042,0.7,0.45],[-0.022,-0.008,-0.042,-0.7,0.45]].forEach(([fx, fy, fz, dir, sweep]) => {
          const fp = new THREE.Group(); fp.position.set(fx, fy, fz);
          const m = new THREE.Mesh(flipGeo, finMat); m.position.set(dir * 0.026, 0, -0.006); m.rotation.y = dir * sweep; m.rotation.z = -dir * 0.25;
          fp.add(m); root.add(fp); flippers.push({ grp: fp, dir });
        });
        const tail1Pivot = new THREE.Group(); tail1Pivot.position.set(0, 0, -0.068);
        const tail1 = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.026, 0.075, 10), dorsalMat); tail1.rotation.x = Math.PI * 0.5; tail1.position.z = -0.035;
        const tail2Pivot = new THREE.Group(); tail2Pivot.position.set(0, 0, -0.070);

        const fluke = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.068, 0.032), finMat); fluke.position.set(0, 0.006, -0.068); fluke.rotation.x = 0.28;
        tail2Pivot.add(tail2, fluke); tail1Pivot.add(tail1, tail2Pivot); root.add(tail1Pivot);
        root.scale.setScalar(1.18);
        regDinoPick(root, 'mosa', 0.16);
        return { key: 'mosa', root, jawPivot, flippers, tail1Pivot, tail2Pivot };
      }

      function createPterodactylus() {
        const root = new THREE.Group();
        const bodyMat = dinoMat(0x9a5b32, 0.55);

        const torso = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 10), bodyMat);
        torso.scale.set(0.78, 0.72, 1.65);
        root.add(torso);

        const headGrp = new THREE.Group();
        headGrp.position.set(0, 0.006, 0.034);
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.010, 0.026, 8), bodyMat);
        neck.rotation.x = Math.PI * 0.42; neck.position.set(0, 0.002, 0.008);
        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.010, 10, 8), bodyMat);

        const beak = new THREE.Mesh(new THREE.ConeGeometry(0.0075, 0.056, 8), beakMat);

        const crest = new THREE.Mesh(new THREE.ConeGeometry(0.0065, 0.034, 6), crestMat);
        crest.rotation.x = -Math.PI * 0.36; crest.scale.set(0.45, 1.0, 1.0); crest.position.set(0, 0.014, 0.005);
        addEyes(headGrp, 0.007, 0.008, 0.024, 0.0026);
        headGrp.add(neck, skull, beak, crest);
        root.add(headGrp);

        function buildWing(dir) {
          const pivot = new THREE.Group();
          pivot.position.set(dir * 0.014, 0.004, 0.008);
          const spar = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.0045, 0.145, 8), bodyMat);
          spar.rotation.z = -dir * Math.PI * 0.5;
          spar.position.set(dir * 0.072, 0, 0.008);

          const memGeo = new THREE.BufferGeometry();
          const verts = new Float32Array([
            0, 0, 0.012,
            dir * 0.145, 0, 0.006,
            dir * 0.065, 0, -0.036,
            0, 0, 0.012,
            dir * 0.065, 0, -0.036,
            0, 0, -0.028
          ]);
          memGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
          memGeo.computeVertexNormals();
          const membrane = new THREE.Mesh(memGeo, membraneMat);
          pivot.add(spar, membrane);
          return pivot;
        }

        const wingLPivot = buildWing(1);
        const wingRPivot = buildWing(-1);
        root.add(wingLPivot, wingRPivot);

        [-0.008, 0.008].forEach(lx => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.002, 0.026, 6), bodyMat);
          leg.rotation.x = Math.PI * 0.48;

        root.scale.setScalar(1.22);

      }

      const dinoWorldGroup = new THREE.Group();
      layerGroups.crust.add(dinoWorldGroup);

      const trackRingGeo = new THREE.RingGeometry(0.085, 0.115, 32);
      trackRingGeo.rotateX(-Math.PI / 2);
      const trackRingMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide, transparent: true, opacity: 0.9, depthWrite: false });
      const trackRingMesh = new THREE.Mesh(trackRingGeo, trackRingMat);
      trackRingMesh.visible = false;
      dinoWorldGroup.add(trackRingMesh);

      function sampleMeadowTrack(theta, lane) {
        const r = 0.405 + clamp(lane, -0.85, 0.85) * 0.048;
        return { nx: VOLC_X + Math.cos(theta) * r, nz: VOLC_Z + Math.sin(theta) * r };
      }

      const brachioDino = { ...createBrachiosaurus(), theta: 0.2, dir:  1, lane: -0.45, targetLane: -0.45, phase: 0.0 };
      const triceDino   = { ...createTriceratops(),   theta: 2.2, dir: -1, lane:  0.45, targetLane:  0.45, phase: 2.1 };
      const stegoDino   = { ...createStegosaurus(),   theta: 4.0, dir:  1, lane:  0.10, targetLane:  0.10, phase: 4.2 };
      const tRexDino    = { ...createTRex(),          theta: 5.3, dir:  1, lane:  0.00, targetLane:  0.00, phase: 1.3, chaseCooldown: 0 };

      const landDinos = [brachioDino, tRexDino, triceDino, stegoDino];
      const herbivores = [brachioDino, triceDino, stegoDino];

      landDinos.forEach(d => {

        const ahead = sampleMeadowTrack(d.theta + d.dir * 0.06, d.lane);
        d.yaw = Math.atan2(ahead.nx - d.nx, ahead.nz - d.nz);
        d.state = 'wander'; d.stateTimer = 0;
        dinoWorldGroup.add(d.root);
      });

      const mosa = createMosasaurus();
      mosa.root.visible = true;
      dinoWorldGroup.add(mosa.root);

      const rawOceanWaypoints = [
        [-0.16, -0.86],
        [-0.44, -0.78],
        [-0.72, -0.54],
        [-0.86, -0.28],
        [-0.89,  0.02],
        [-0.84,  0.20],
        [-0.64,  0.04],
        [-0.66, -0.18],
        [-0.74, -0.38],
        [-0.34, -0.74]
      ];
      const verifiedOceanPoints = rawOceanWaypoints.map(([nx, nz]) => {
        let cx = nx, cz = nz;
        for (let step = 0; step < 12; step++) {
          const s = evalSurf(cx, cz);
          if (s.landMask < 0.01 && s.landVal < -0.12) break;
          const r = Math.hypot(cx, cz) + 1e-6;
          const nextR = Math.min(0.90, r + 0.025);
          cx = (cx / r) * nextR;
          cz = (cz / r) * nextR;
        }
        return new THREE.Vector3(cx * R_DISC, 1.842, cz * R_DISC);
      });
      const oceanLoopCurve = new THREE.CatmullRomCurve3(verifiedOceanPoints, true, 'centripetal', 0.5);

      const mosaState = {
        u: 0.0,
        swimSpeed: 0.036,
        jumpDeltaU: 0.115,
        uStart: 0.0,
        active: false,
        timer: 2.2,
        progress: 0,
        duration: 1.60,
        entrySplashTriggered: false
      };

      const ptero = createPterodactylus();
      dinoWorldGroup.add(ptero.root);

      const dinoMap = {
        trex: tRexDino,
        brachio: brachioDino,
        trice: triceDino,
        stego: stegoDino,
        mosa: mosa,

      };

      const splashCount = 38, splashGeo = new THREE.BufferGeometry(), splashPosArr = new Float32Array(splashCount * 3), splashVels = [];
      for (let i = 0; i < splashCount; i++) splashVels.push({ x: 0, y: 0, z: 0 });
      splashGeo.setAttribute('position', new THREE.BufferAttribute(splashPosArr, 3));
      const splashMat = new THREE.PointsMaterial({ color: 0xe0f7ff, size: 0.052, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      dinoWorldGroup.add(new THREE.Points(splashGeo, splashMat));

      const splashRings = [];

        const rg = new THREE.RingGeometry(0.03, 0.065, 28); rg.rotateX(-Math.PI / 2);
        const rm = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0, depthWrite: false });
        const rMesh = new THREE.Mesh(rg, rm);
        dinoWorldGroup.add(rMesh);
        splashRings.push({ mesh: rMesh, mat: rm, delay: i * 0.14 });

      let splashActive = false, splashElapsed = 0, splashOrigin = { x: 0, y: 1.86, z: 0 }, splashIntensity = 1.0;
      function triggerWaterSplash(wx, wz, intensity = 1.0) {
        splashActive = true; splashElapsed = 0; splashIntensity = intensity;
        splashOrigin = { x: wx, y: 1.86, z: wz };
        for (let i = 0; i < splashCount; i++) {
          const ang = Math.random() * Math.PI * 2, outSpd = (0.18 + Math.random() * 0.42) * intensity;
          splashVels[i].x = Math.cos(ang) * outSpd;

          splashVels[i].z = Math.sin(ang) * outSpd;

        }

      }

      // 2. LITHOSPHERE & ASTHENOSPHERE
      {
        const lGeo = new THREE.CylinderGeometry(2.05, 1.72, 0.52, 180, 36, false);
        const pos = lGeo.attributes.position, norm = lGeo.attributes.normal, v = new THREE.Vector3();
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          const r = Math.hypot(v.x, v.z);
          if (Math.abs(norm.getY(i)) < 0.5 && r > 0.3) {
            const ang = Math.atan2(v.z, v.x);
            v.y += (Math.sin(ang * 8) * 0.085 + Math.cos(ang * 15 + 0.7) * 0.055 + Math.sin(ang * 23 - 0.4) * 0.025) * clamp((0.08 - v.y) / 0.34, 0, 1);
            const fold = Math.sin((v.y + Math.sin(ang * 8) * 0.14 + Math.cos(ang * 15) * 0.08) * 26) * 0.032 + Math.cos(ang * 16 + v.y * 12) * 0.016;
            v.x *= (r + fold) / r; v.z *= (r + fold) / r;
          }
          pos.setXYZ(i, v.x, v.y, v.z);
        }
        lGeo.computeVertexNormals();
        const lMat = new THREE.ShaderMaterial({
          uniforms: { uHighlight: highlightUniforms.litho, uSun: { value: new THREE.Vector3(0.55, 0.78, 0.55).normalize() } },
          vertexShader: `varying vec3 vPos; varying vec3 vNorm; varying vec3 vObjNorm; void main(){vPos=position;vObjNorm=normal;vNorm=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
          fragmentShader: `
            uniform float uHighlight; uniform vec3 uSun; varying vec3 vPos; varying vec3 vNorm; varying vec3 vObjNorm;
            ${SHADER_NOISE}
            void main(){
              vec3 gD = vec3(0.36,0.22,0.14), fM = vec3(0.65,0.46,0.31), fC = vec3(0.86,0.69,0.53), col;
              if(abs(vObjNorm.y) > 0.5){
                float r = length(vPos.xz), rg = sin(r*18.0+fbm3(vPos*6.0)*3.5);
                col = mix(mix(gD,fM,smoothstep(-0.6,0.2,rg)), fC, smoothstep(0.2,0.8,rg));
                col = mix(col, vec3(0.98,0.38,0.05), smoothstep(0.30,0.05,r)*0.88);
              } else {
                float ang = atan(vPos.z,vPos.x), hV = sin((vPos.y+sin(ang*8.0)*0.15+cos(ang*15.0+0.7)*0.09+snoise(vec3(ang*5.0,vPos.y*5.0,1.5))*0.14)*42.0)*0.78 + fbm3(vPos*12.0)*0.22;
                col = mix(mix(gD,fM,smoothstep(-0.75,0.1,hV)), fC, smoothstep(0.15,0.78,hV));
              }
              col = col * (max(dot(normalize(vNorm),uSun),0.0)*0.58+0.42) + vec3(0.25,0.95,0.65)*uHighlight*0.32;
              gl_FragColor = vec4(col, 1.0);
            }
          `
        });
        const lMesh = new THREE.Mesh(lGeo, lMat); lMesh.position.y = 1.24;
        layerGroups.litho.add(lMesh); regPick(lMesh, 'litho');
      }

      // 3. DEEP MANTLE
      {
        const mGeo = new THREE.CylinderGeometry(1.70, 0.98, 1.55, 180, 52, false);
        const pos = mGeo.attributes.position, norm = mGeo.attributes.normal, v = new THREE.Vector3();
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          const r = Math.hypot(v.x, v.z);
          if (Math.abs(norm.getY(i)) < 0.5 && r > 0.25 && Math.abs(v.y) < 0.755) {
            const ang = Math.atan2(v.z, v.x);
            const disp = (Math.sin(ang * 14 + v.y * 3.5) * 0.042 + Math.cos(ang * 23 - v.y * 5) * 0.028 + fbm(v.x * 2.6, v.y * 2.6, v.z * 2.6) * 0.075 + fbm(v.x * 6, v.y * 6, v.z * 6) * 0.03) * smoothstep(0.76, 0.64, Math.abs(v.y));
            v.x *= (r + disp) / r; v.z *= (r + disp) / r;
          }
          pos.setXYZ(i, v.x, v.y, v.z);
        }
        mGeo.computeVertexNormals();
        const mMat = new THREE.ShaderMaterial({
          uniforms: { uHighlight: highlightUniforms.mantle, uSun: { value: new THREE.Vector3(0.55, 0.78, 0.55).normalize() } },
          vertexShader: `varying vec3 vPos; varying vec3 vNorm; varying vec3 vObjNorm; varying vec3 vViewDir; void main(){vPos=position;vObjNorm=normal;vec4 mv=modelViewMatrix*vec4(position,1.0);vViewDir=normalize(-mv.xyz);vNorm=normalize(normalMatrix*normal);gl_Position=projectionMatrix*mv;}`,
          fragmentShader: `
            uniform float uHighlight; uniform vec3 uSun; varying vec3 vPos; varying vec3 vNorm; varying vec3 vObjNorm; varying vec3 vViewDir;
            ${SHADER_NOISE}
            void main(){
              float hM = fbm3(vPos*3.2)*0.65 - smoothstep(0.0,0.25,abs(snoise(vPos*6.5)))*0.35 + snoise(vPos*20.0)*0.08;
              vec3 col = mix(mix(vec3(0.28,0.10,0.07),vec3(0.58,0.25,0.16),smoothstep(-0.48,0.28,hM)), vec3(0.76,0.39,0.25), smoothstep(0.22,0.72,hM));
              if(vObjNorm.y > 0.5) col = mix(col, vec3(0.95,0.36,0.06), smoothstep(0.65,0.08,length(vPos.xz))*0.75);
              else if(vObjNorm.y < -0.5) col *= 0.45 + 0.45*smoothstep(0.84,0.96,length(vPos.xz));
              else col *= 0.48 + 0.52*smoothstep(0.08,0.35,clamp(dot(normalize(vNorm),vViewDir),0.0,1.0));
              col = col * (max(dot(normalize(vNorm),uSun),0.0)*0.65+0.35) + vec3(0.25,0.95,0.65)*uHighlight*0.32;
              gl_FragColor = vec4(col, 1.0);
            }
          `
        });
        const mMesh = new THREE.Mesh(mGeo, mMat); mMesh.position.y = 0.28;
        layerGroups.mantle.add(mMesh); regPick(mMesh, 'mantle');
      }

      // 4. LIQUID OUTER CORE + VISCOUS LAVA DROPPING & SUBTLE MINI MAGMA SPATTER
      let outerCoreMat = null;
      const coreLavaDrops = [];
      const coreMiniBursts = [];
      {
        const oGeo = new THREE.CylinderGeometry(0.88, 0.43, 1.18, 16, 24, false);
        oGeo.computeVertexNormals();
        outerCoreMat = new THREE.ShaderMaterial({
          extensions: { derivatives: true },
          uniforms: { uTime: { value: 0 }, uHighlight: highlightUniforms.outerCore },
          vertexShader: `varying vec3 vPos; varying vec3 vViewPos; varying vec3 vViewDir; varying vec3 vNorm; varying vec3 vObjNorm; void main(){vPos=position;vObjNorm=normal;vec4 mv=modelViewMatrix*vec4(position,1.0);vViewPos=-mv.xyz;vViewDir=normalize(-mv.xyz);vNorm=normalize(normalMatrix*normal);gl_Position=projectionMatrix*mv;}`,
          fragmentShader: `
            uniform float uTime; uniform float uHighlight; varying vec3 vPos; varying vec3 vViewPos; varying vec3 vViewDir; varying vec3 vNorm; varying vec3 vObjNorm;
            ${SHADER_NOISE}
            void main(){
              vec3 p = vPos*2.9 + vec3(0.0,-uTime*0.45,0.0); float wp = fbm3(p), lv = fbm3(p*1.7+vec3(wp*1.5));
              vec3 dR = vec3(0.68,0.02,0.0), fR = vec3(0.95,0.16,0.01), mO = vec3(1.0,0.46,0.03), bG = vec3(1.0,0.76,0.18), col;
              if(abs(vObjNorm.y) > 0.5){
                float r = length(vPos.xz)/0.88;
                col = mix(fR, mO, smoothstep(-0.5,0.3,lv+sin(r*14.0-uTime*2.0+lv*4.0)*0.3));
                col = mix(col, bG, smoothstep(0.65,0.05,r)*0.75);
              } else {
                vec3 fN = normalize(cross(dFdx(vViewPos), dFdy(vViewPos)));
                float mV = lv*0.65 + clamp((0.59-vPos.y)/1.18,0.0,1.0)*0.55 + dot(fN,normalize(vec3(0.5,0.4,0.8)))*0.14;
                col = mix(mix(mix(dR,fR,smoothstep(-0.35,0.15,mV)),mO,smoothstep(0.15,0.55,mV)),bG,smoothstep(0.55,0.92,mV));
                col *= 0.45+0.55*smoothstep(0.05,0.28,clamp(dot(normalize(vNorm),vViewDir),0.0,1.0));
              }
              gl_FragColor = vec4(col + vec3(0.25,0.95,0.65)*uHighlight*0.32, 1.0);
            }
          `
        });
        const oMesh = new THREE.Mesh(oGeo, outerCoreMat); oMesh.position.y = -1.06;
        layerGroups.outerCore.add(oMesh); regPick(oMesh, 'outerCore');

        const dropGeo = new THREE.SphereGeometry(0.021, 10, 10);
        for (let i = 0; i < 14; i++) {
          const dMat = new THREE.MeshBasicMaterial({ color: 0xffaa22, transparent: true, opacity: 0.95 });
          const dMesh = new THREE.Mesh(dropGeo, dMat);
          regPick(dMesh, 'outerCore');
          layerGroups.outerCore.add(dMesh);
          const isUpper = i < 9;
          coreLavaDrops.push({ mesh: dMesh, mat: dMat, isUpper, angle: (i / (isUpper ? 9 : 5)) * Math.PI * 2 + Math.random() * 0.4, phase: Math.random(), speed: 0.24 + Math.random() * 0.16 });
        }

        const globGeo = new THREE.SphereGeometry(0.015, 8, 8);
        const blisterGeo = new THREE.SphereGeometry(0.028, 10, 10);
        for (let b = 0; b < 4; b++) {
          const blisterMat = new THREE.MeshBasicMaterial({ color: 0xffdd55, transparent: true, opacity: 0 });
          const blisterMesh = new THREE.Mesh(blisterGeo, blisterMat);
          layerGroups.outerCore.add(blisterMesh);
          const globs = [];
          for (let g = 0; g < 5; g++) {
            const gMat = new THREE.MeshBasicMaterial({ color: 0xff7711, transparent: true, opacity: 0 });
            const gMesh = new THREE.Mesh(globGeo, gMat);
            layerGroups.outerCore.add(gMesh);
            globs.push({ mesh: gMesh, mat: gMat, vx: 0, vy: 0, vz: 0 });
          }
          coreMiniBursts.push({ blisterMesh, blisterMat, globs, timer: b * 0.85, duration: 1.45, active: false, originX: 0, originY: 0, originZ: 0, normX: 0, normZ: 0 });
        }
      }

      function spawnMiniBurstSite(b) {
        const ang = Math.random() * Math.PI * 2;
        const localH = (Math.random() - 0.35) * 0.85;
        const tCone = clamp((0.59 - localH) / 1.18, 0, 1);
