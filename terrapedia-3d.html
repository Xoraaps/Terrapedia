        b.normX = Math.cos(ang); b.normZ = Math.sin(ang);
        b.originX = b.normX * rCone; b.originY = -1.06 + localH; b.originZ = b.normZ * rCone;
        b.blisterMesh.position.set(b.originX, b.originY, b.originZ);
        b.globs.forEach((g, idx) => {
          const spreadAng = ang + (idx - 2) * 0.28 + (Math.random() - 0.5) * 0.2;
          const outSpd = 0.09 + Math.random() * 0.11;
          g.vx = Math.cos(spreadAng) * outSpd; g.vy = 0.16 + Math.random() * 0.14; g.vz = Math.sin(spreadAng) * outSpd;
        });
      }

      // 5. SOLID INNER CORE
      let innerCoreMat = null;
      {
        const iGeo = new THREE.CylinderGeometry(0.36, 0.004, 0.92, 14, 20, false);
        const pos = iGeo.attributes.position, norm = iGeo.attributes.normal;
        for (let i = 0; i < pos.count; i++) {
          const y = pos.getY(i);
          if (Math.abs(norm.getY(i)) < 0.5 && y > 0.32) {
            const lp = 1 + Math.sin(((y - 0.32) / 0.14) * Math.PI) * 0.06;
            pos.setX(i, pos.getX(i) * lp); pos.setZ(i, pos.getZ(i) * lp);
          }
        }
        iGeo.computeVertexNormals();
        innerCoreMat = new THREE.ShaderMaterial({
          extensions: { derivatives: true },
          uniforms: { uTime: { value: 0 }, uHighlight: highlightUniforms.innerCore },
          vertexShader: `varying vec3 vPos; varying vec3 vViewPos; varying vec3 vViewDir; varying vec3 vNorm; varying vec3 vObjNorm; void main(){vPos=position;vObjNorm=normal;vec4 mv=modelViewMatrix*vec4(position,1.0);vViewPos=-mv.xyz;vViewDir=normalize(-mv.xyz);vNorm=normalize(normalMatrix*normal);gl_Position=projectionMatrix*mv;}`,
          fragmentShader: `
            uniform float uTime; uniform float uHighlight; varying vec3 vPos; varying vec3 vViewPos; varying vec3 vViewDir; varying vec3 vNorm; varying vec3 vObjNorm;
            ${SHADER_NOISE}
            void main(){
              vec3 cO = vec3(0.98,0.46,0.06), wY = vec3(1.0,0.86,0.42), wT = vec3(0.99,0.99,0.92), col;
              float gr = fbm3(vPos*14.0+vec3(0.0,uTime*0.55,0.0))*0.08;
              if(vObjNorm.y > 0.5){
                float r = length(vPos.xz)/0.36;
                col = mix(wT, wY, smoothstep(0.15,0.78,r + sin(r*16.0-uTime*2.5+gr*8.0)*0.08));
                col = mix(col, cO, smoothstep(0.75,0.98,r));
              } else {
                float fc = dot(normalize(cross(dFdx(vViewPos),dFdy(vViewPos))), normalize(vec3(0.6,0.3,0.7)))*0.08;
                float t = clamp((0.46-vPos.y)/0.92, 0.0, 1.0);
                col = mix(mix(cO,wY,smoothstep(0.0,0.36,t+gr+fc)), wT, smoothstep(0.32,0.88,t+fc));
                col *= 0.45+0.55*smoothstep(0.04,0.24,clamp(dot(normalize(vNorm),vViewDir),0.0,1.0));
              }
              gl_FragColor = vec4(col + vec3(0.25,0.95,0.65)*uHighlight*0.32, 1.0);
            }
          `
        });
        const iMesh = new THREE.Mesh(iGeo, innerCoreMat); iMesh.position.y = -2.09;
        layerGroups.innerCore.add(iMesh); regPick(iMesh, 'innerCore');
      }
      // ================= LABEL MENGAMBANG LAPISAN (pola BAB 02–06) =================
      // Struktur seragam: lingkaran warna + nomor + nama. Klik label = toggleLayer(k)
      // (panel info muncul; klik lagi = panel hilang). Anchor adalah anak layer group
      // sehingga ikut explode, dan proyeksi per-frame mengompensasi rotasi model.
      // BBox dihitung dari mesh pickable tiap lapisan (bbox group mentah bisa memuat
      // objek helper yang disembunyikan jauh di bawah, mis. spawn dino di y=-1000).
      scene.updateMatrixWorld(true);
      const _TP_V = new THREE.Vector3(), _TP_FWD = new THREE.Vector3(), _TP_RIGHT = new THREE.Vector3(), _TP_UPA = new THREE.Vector3(), _TP_UPB = new THREE.Vector3();
      const _TP_BOX = new THREE.Box3(), _TP_C = new THREE.Vector3();
      const labelHost = document.createElement('div');
      labelHost.id = 'tp3dLabels';
      document.body.appendChild(labelHost);
      const layerLabelItems = [];
      const TP_LABEL_SIDE = { crust: 1, litho: -1, mantle: 1, outerCore: -1, innerCore: 1 };
      LAYER_ORDER.forEach((k, li) => {
        const g = layerGroups[k];
        _TP_BOX.makeEmpty();
        pickableMeshes.forEach(m => { if (m.userData.layerKey === k) _TP_BOX.expandByObject(m); });
        if (_TP_BOX.isEmpty()) _TP_BOX.setFromObject(g);
        _TP_BOX.getCenter(_TP_C);
        const halfX = (_TP_BOX.max.x - _TP_BOX.min.x) * 0.5;
        const side = TP_LABEL_SIDE[k] || 1;
        const anchor = new THREE.Object3D();
        anchor.position.set(side * (Math.abs(_TP_C.x) + halfX + 0.55), _TP_C.y - wedgeRoot.position.y, _TP_C.z + 0.55);
        g.add(anchor);
        const num = String(li + 1).padStart(2, '0');
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'tp-layer-label';
        el.dataset.layer = k;
        el.innerHTML = `<span class="tp-dot" style="background:${LAYER_DATA[k].color}"></span><span class="tp-num">${num}</span><span class="tp-name">${LAYER_DATA[k][lang].shortName.replace(/^\s*\d+\.\s*/, '')}</span>`;
        el.addEventListener('click', (e) => { e.stopPropagation(); toggleLayer(k); });
        labelHost.appendChild(el);
        layerLabelItems.push({ key: k, anchor, el });
      });

      // ================= CAMERA FLIGHT, PICKING & UI WIRING =================
      const OVERVIEW_POS = new THREE.Vector3(0, 1.35, 8.3);
      const OVERVIEW_TGT = new THREE.Vector3(0, 0.22, 0);
      const CAM_PRESETS = {
        iso:    { pos: OVERVIEW_POS, tgt: OVERVIEW_TGT },
        top:    { pos: new THREE.Vector3(0, 8.6, 0.02), tgt: OVERVIEW_TGT },
        bottom: { pos: new THREE.Vector3(0, -7.9, 0.02), tgt: OVERVIEW_TGT }
      };

      const explodeOffsets = { crust: 0.62, litho: 0.30, mantle: 0.0, outerCore: -0.30, innerCore: -0.62 };
      const explodeCur = { crust: 0, litho: 0, mantle: 0, outerCore: 0, innerCore: 0 };

      const clock = new THREE.Clock();
      const LAVA_BRIGHT = new THREE.Color(0xffdd55);
      const LAVA_MID = new THREE.Color(0xff7722);
      const LAVA_DEEP = new THREE.Color(0xff4d00);
      const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
      const easeInOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

      let flight = null;
      let followDinoKey = null;
      const lastFollowPos = new THREE.Vector3();
      const followOffset = new THREE.Vector3();

      function startFlight(toPos, toTarget, duration = 1.2) {
        flight = {
          fromPos: camera.position.clone(), fromTarget: controls.target.clone(),
          toPos: toPos.clone(), toTarget: toTarget.clone(),
          t: 0, duration: Math.max(duration, 0.01)
        };
      }

      function clearCamActive() {
        document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('active'));
      }

      function zoomToLayer(k) {
        const cfg = LAYER_FOCUS_CFG[k];
        if (!cfg) return;
        followDinoKey = null;
        clearCamActive();
        const ty = cfg.baseY;
        const camPos = new THREE.Vector3(0, ty + Math.sin(cfg.elev) * cfg.dist, Math.cos(cfg.elev) * cfg.dist);
        startFlight(camPos, new THREE.Vector3(0, ty, 0), 1.25);
      }

      function zoomToDino(dk) {
        const d = dinoMap[dk];
        if (!d) return;
        clearCamActive();
        d.root.getWorldPosition(_v1);
        const dir = _v2.copy(camera.position).sub(_v1);
        if (dir.lengthSq() < 1e-6) dir.set(0, 0.35, 1);
        dir.normalize(); dir.y = Math.max(dir.y, 0.3); dir.normalize();
        const dist = dk === 'mosa' ? 1.3 : (dk === 'ptero' ? 1.4 : 1.0);
        dir.multiplyScalar(dist);
        followOffset.copy(dir); // camera sits at this exact offset from the dino
        startFlight(_v3.copy(_v1).add(dir), _v1, 1.2);
      }

      function zoomOutOverview() {
        followDinoKey = null;
        clearCamActive();
        startFlight(OVERVIEW_POS, OVERVIEW_TGT, 1.15);
      }

      function deselectAll() {
        selectedDino = null; selectedLayer = null; followDinoKey = null;
        trackRingMesh.visible = false;
        renderUI();
      }

      function toggleDino(dk) {
        if (selectedDino === dk) { deselectAll(); zoomOutOverview(); return; }
        selectedDino = dk; selectedLayer = null; followDinoKey = dk;
        renderUI();
        zoomToDino(dk);
      }

      function toggleLayer(k) {
        if (selectedLayer === k) { deselectAll(); zoomOutOverview(); return; }
        selectedLayer = k; selectedDino = null; followDinoKey = null;
        renderUI();
        zoomToLayer(k);
      }

      // Raycast picking (dinos -> volcano -> layers) + hover cursor + tap-to-close
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      let downPos = null;

      function setNDC(e) {
        pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
      }

      function raycastScene() {
        raycaster.setFromCamera(pointerNDC, camera);
        const dHits = raycaster.intersectObjects(dinoPickMeshes, false);
        if (dHits.length) return { type: 'dino', key: dHits[0].object.userData.dinoKey };
        if (volcanoHitMesh && raycaster.intersectObject(volcanoHitMesh, false).length) return { type: 'volcano' };
        const lHits = raycaster.intersectObjects(pickableMeshes, false);
        if (lHits.length) return { type: 'layer', key: lHits[0].object.userData.layerKey };
        return null;
      }

      canvas.addEventListener('pointermove', (e) => {
        setNDC(e);
        canvas.classList.toggle('hover-target', Boolean(raycastScene()));
      });
      canvas.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
      canvas.addEventListener('pointerup', (e) => {
        if (!downPos) return;
        const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
        downPos = null;
        if (moved > 7) return;
        setNDC(e);
        const hit = raycastScene();
        if (!hit) {
          if (selectedDino || selectedLayer) { deselectAll(); zoomOutOverview(); }
          return;
        }
        if (hit.type === 'dino') toggleDino(hit.key);
        else if (hit.type === 'volcano') triggerVolcanoEruption();
        else toggleLayer(hit.key);
      });

      controls.addEventListener('start', () => { flight = null; });

      // Info panel close
      document.getElementById('infoCloseBtn').addEventListener('click', () => {
        deselectAll(); zoomOutOverview();
      });

      // Camera preset buttons
      function setPreset(key) {
        const p = CAM_PRESETS[key];
        if (!p) return;
        document.querySelectorAll('[data-cam]').forEach(b => b.classList.toggle('active', b.getAttribute('data-cam') === key));
        followDinoKey = null;
        startFlight(p.pos, p.tgt, 1.3);
      }
      document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => setPreset(b.getAttribute('data-cam'))));

      // Explode slider
      const explodeSliderEl = document.getElementById('explodeSlider');
      const explodeValEl = document.getElementById('explodeVal');
      explodeSliderEl.addEventListener('input', () => {
        explodeAmount = explodeSliderEl.value / 100;
        explodeValEl.textContent = explodeSliderEl.value + '%';
      });

      // Auto spin toggle
      const autoSpinBtnEl = document.getElementById('autoSpinBtn');
      autoSpinBtnEl.addEventListener('click', () => {
        autoSpin = !autoSpin;
        autoSpinBtnEl.classList.toggle('active', autoSpin);
      });

      // Reset view
      document.getElementById('resetViewBtn').addEventListener('click', () => {
        deselectAll();
        explodeAmount = 0;
        explodeSliderEl.value = 0;
        explodeValEl.textContent = '0%';
        document.querySelectorAll('[data-cam]').forEach(b => b.classList.toggle('active', b.getAttribute('data-cam') === 'iso'));
        startFlight(CAM_PRESETS.iso.pos, CAM_PRESETS.iso.tgt, 1.25);
      });

      // Language pills
      document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
        const next = b.getAttribute('data-lang');
        if (lang === next) return;
        lang = next;
        document.querySelectorAll('[data-lang]').forEach(x => x.classList.toggle('active', x === b));
        renderUI();
        if (articleOverlayEl.classList.contains('open')) renderArticle();
      }));

      // ================= MAIN ANIMATION LOOP =================
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;

        if (autoSpin && !flight) wedgeRoot.rotation.y += dt * 0.06;

        // Layer explosion easing + highlight glow easing
        for (let i = 0; i < LAYER_ORDER.length; i++) {
          const k = LAYER_ORDER[i];
          const ty = explodeOffsets[k] * explodeAmount;
          explodeCur[k] += (ty - explodeCur[k]) * Math.min(1, dt * 7);
          layerGroups[k].position.y = explodeCur[k];
          const hl = highlightUniforms[k];
          hl.value += ((selectedLayer === k ? 1 : 0) - hl.value) * Math.min(1, dt * 6);
        }

        // (a) Proyeksi label mengambang lapisan → layar (kompensasi rotasi wedgeRoot).
        // World→view dihitung manual dari posisi & arah kamera: engine THREE bundel
        // halaman ini tidak selalu menyegarkan camera.matrixWorldInverse untuk project().
        camera.getWorldDirection(_TP_FWD);
        _TP_RIGHT.copy(_TP_FWD).cross(_TP_UPA.set(0, 1, 0)).normalize();
        _TP_UPB.copy(_TP_RIGHT).cross(_TP_FWD).normalize();
        for (let li = 0; li < layerLabelItems.length; li++) {
          const item = layerLabelItems[li];
          item.anchor.getWorldPosition(_TP_V);
          _TP_V.sub(wedgeRoot.position);
          if (wedgeRoot.rotation.y) {
            const _ca = Math.cos(-wedgeRoot.rotation.y), _sa = Math.sin(-wedgeRoot.rotation.y);
            const _vx = _TP_V.x, _vz = _TP_V.z;
            _TP_V.x = _vx * _ca + _vz * _sa;
            _TP_V.z = -_vx * _sa + _vz * _ca;
          }
          _TP_V.sub(camera.position);
          const zc = _TP_V.dot(_TP_FWD);
          if (zc > 0.001) {
            const f = 1 / Math.tan((camera.fov || 36) * Math.PI / 360);
            const ndcX = (f / (camera.aspect || 1)) * (_TP_V.dot(_TP_RIGHT)) / zc;
            const ndcY = f * (_TP_V.dot(_TP_UPB)) / zc;
            // Clamp ke dalam viewport: model memenuhi layar, label lapisan terbawah
            // bisa jatuh di luar tepi — tetap tampil agar selalu bisa diklik.
            item.el.style.opacity = '1';
            item.el.style.pointerEvents = 'auto';
            item.el.style.transform = `translate(-50%,-50%) translate(${
              Math.max(46, Math.min(window.innerWidth - 46, (ndcX * 0.5 + 0.5) * window.innerWidth))
            }px, ${
              Math.max(28, Math.min(window.innerHeight - 28, (-ndcY * 0.5 + 0.5) * window.innerHeight))
            }px)`;
          } else {
            item.el.style.opacity = '0';
            item.el.style.pointerEvents = 'none';
          }
        }

        // Sky: star twinkle + camera-facing halo backglow
        starMat.uniforms.uTime.value = t;
        haloMesh.position.copy(camera.position).normalize().multiplyScalar(-40);
        haloMesh.lookAt(camera.position);

        // Volcano: eruption decay, crater light flicker, pulse ring
        if (eruptBoost > 0) eruptBoost = Math.max(0, eruptBoost - dt * 0.5);
        const crustU = layerGroups.crust.userData;
        if (crustU.topDiscMat) {
          crustU.topDiscMat.uniforms.uTime.value = t;
          crustU.topDiscMat.uniforms.uErupt.value = eruptBoost;
        }
        if (crustU.cliffWallMat) crustU.cliffWallMat.uniforms.uTime.value = t;
        if (crustU.underCapMat) crustU.underCapMat.uniforms.uTime.value = t;
        craterPulseAge += dt;
        if (craterPulseAge < 0.85) {
          const pa = craterPulseAge / 0.85;
          craterPulseMat.opacity = (1 - pa) * 0.7;
          craterPulseRing.scale.setScalar(1 + pa * 3.4);
        } else {
          craterPulseMat.opacity = 0;
        }
        if (craterLight) craterLight.intensity = 0.5 + eruptBoost * 1.7 + (0.08 + 0.08 * Math.sin(t * 7.3)) * (0.35 + eruptBoost);

        // Volcano smoke puffs rising & fading
        if (crustU.smokePuffs) {
          for (let i = 0; i < crustU.smokePuffs.length; i++) {
            const sp = crustU.smokePuffs[i];
            const p = (t * 0.36 + sp.phase) % 1;
            const drift = 0.10 + p * 0.55;
            sp.mesh.position.set(
              VOLC_X * R_DISC + Math.sin(sp.phase * 9.4 + t * 0.4) * drift,
              2.34 + p * 0.62,
              VOLC_Z * R_DISC + Math.cos(sp.phase * 7.7 + t * 0.4) * drift
            );
            sp.mesh.scale.setScalar(0.45 + p * 1.5);
            sp.mat.uniforms.uTime.value = t;
            sp.mat.uniforms.uAlpha.value = 0.75 * (1 - p) * (1 - p);
            sp.mat.uniforms.uWarmGlow.value = Math.max(0, 1 - p * 2.4) * (0.35 + eruptBoost * 0.8);
          }
        }

        // Ambient crater embers drifting upward
        if (crustU.emberPoints && crustU.emberData) {
          const eAttr = crustU.emberPoints.geometry.attributes.position;
          for (let i = 0; i < crustU.emberData.length; i++) {
            const em = crustU.emberData[i];
            em.phase = (em.phase + dt * em.speed) % 1;
            const er = em.phase * 2.4;
            eAttr.setXYZ(i,
              VOLC_X * R_DISC + em.vx * er,
              2.30 + em.phase * em.peakH * 3.2,
              VOLC_Z * R_DISC + em.vz * er);
          }
          eAttr.needsUpdate = true;
        }

        // Erupting lava bombs (parabolic ballistics + heat coloring)
        for (let i = 0; i < lavaBombs.length; i++) {
          const b = lavaBombs[i];
          if (!b.active) continue;
          b.age += dt;
          if (b.age >= b.life) { b.active = false; b.mesh.visible = false; continue; }
          b.vy -= 3.1 * dt;
          b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
          if (b.y < 1.85 + evalSurf(clamp(b.x / R_DISC, -1, 1), clamp(b.z / R_DISC, -1, 1)).height) {
            b.active = false; b.mesh.visible = false; continue;
          }
          const la = b.age / b.life;
          b.mesh.position.set(b.x, b.y, b.z);
          b.mesh.rotation.x += dt * 6; b.mesh.rotation.y += dt * 4.5;
          b.mesh.scale.setScalar(b.baseScale * (1 - la * 0.35));
          b.mat.color.copy(LAVA_MID).lerp(LAVA_BRIGHT, clamp(1.1 - la * 1.4 + eruptBoost * 0.35, 0, 1));
          b.mat.opacity = 1 - smoothstep(0.75, 1, la);
        }

        // Eruption spark points
        let sparkDirty = false;
        for (let i = 0; i < eruptSparks.length; i++) {
          const sp = eruptSparks[i];
          if (!sp.active) continue;
          sp.age += dt;
          if (sp.age >= sp.life) { sp.active = false; eruptSparkPosArr[i * 3 + 1] = -999; sparkDirty = true; continue; }
          sp.vy -= 2.6 * dt;
          sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.z += sp.vz * dt;
          eruptSparkPosArr[i * 3] = sp.x; eruptSparkPosArr[i * 3 + 1] = sp.y; eruptSparkPosArr[i * 3 + 2] = sp.z;
          sparkDirty = true;
        }
        if (sparkDirty) eruptSparkGeo.attributes.position.needsUpdate = true;
        if (eruptSparkMat) eruptSparkMat.color.copy(LAVA_MID).lerp(LAVA_BRIGHT, 0.4 + eruptBoost * 0.55);

        // Core shader clocks
        if (outerCoreMat) outerCoreMat.uniforms.uTime.value = t;
        if (innerCoreMat) innerCoreMat.uniforms.uTime.value = t;
  
        // Outer core viscous lava drops sliding down the cone wall
        for (let i = 0; i < coreLavaDrops.length; i++) {
          const d = coreLavaDrops[i];
          d.phase = (d.phase + dt * d.speed) % 1;
          const pFall = smoothstep(0, 0.85, d.phase);
          const localH = lerp(0.40, -0.48, pFall) - (d.isUpper ? 0 : 0.08);
          const tCone = clamp((0.59 - localH) / 1.18, 0, 1);
          const rr = lerp(0.88, 0.43, tCone) * 1.004;
          d.mesh.position.set(Math.cos(d.angle) * rr, -1.06 + localH, Math.sin(d.angle) * rr);
          d.mesh.scale.set(1 - d.phase * 0.25, 1 + d.phase * 0.9, 1 - d.phase * 0.25);
          d.mat.opacity = (d.phase > 0.85 ? (1 - d.phase) / 0.15 : 1) * 0.95;
          d.mat.color.copy(LAVA_MID).lerp(LAVA_BRIGHT, 0.35 + 0.35 * Math.sin(t * 3 + i * 1.7));
        }

        // Outer core mini magma bursts (blister grows, pops into globs)
        for (let i = 0; i < coreMiniBursts.length; i++) {
          const b = coreMiniBursts[i];
          if (!b.active) {
            b.timer -= dt;
            if (b.timer <= 0) {
              b.active = true; b.progress = 0;
              spawnMiniBurstSite(b);
              b.blisterMesh.scale.setScalar(0.35);
              b.blisterMat.opacity = 0;
              b.globs.forEach(g => { g.mesh.position.set(b.originX, b.originY, b.originZ); g.mat.opacity = 0; });
            }
            continue;
          }
          b.progress += dt / b.duration;
          if (b.progress >= 1) {
            b.active = false; b.timer = 1.8 + Math.random() * 3.2;
            b.blisterMat.opacity = 0;
            b.globs.forEach(g => { g.mat.opacity = 0; });
            continue;
          }
          const bp = b.progress;
          if (bp < 0.52) {
            const grow = smoothstep(0, 0.52, bp);
            b.blisterMat.opacity = grow * 0.9;
            b.blisterMesh.scale.setScalar(0.35 + grow * 0.75);
          } else {
            const ft = (bp - 0.52) / 0.48;
            b.blisterMat.opacity = Math.max(0, 1 - ft * 3) * 0.9;
            b.blisterMesh.scale.setScalar(1.1 - ft * 0.5);
            b.globs.forEach(g => {
              g.vy -= 0.55 * dt;
              g.mesh.position.x += g.vx * dt * 2.1;
              g.mesh.position.y += g.vy * dt * 2.1;
              g.mesh.position.z += g.vz * dt * 2.1;
              g.mat.opacity = Math.max(0, 1 - ft) * 0.95;
              g.mesh.scale.setScalar(Math.max(0.2, 1 - ft * 0.35));
            });
          }
        }

        // Land dino AI: T-Rex hunts, herbivores wander & flee along the meadow track
        for (let i = 0; i < landDinos.length; i++) {
          const d = landDinos[i];
          const isTrex = d.key === 'trex';
          d.stateTimer -= dt;
          if (d.stateTimer <= 0) {
            if (isTrex) {
              if (d.state === 'chase') { d.state = 'wander'; d.stateTimer = 3.5 + Math.random() * 4; d.chaseTarget = null; }
              else if (Math.random() < 0.72) {
                d.state = 'chase';
                d.chaseTarget = herbivores[(Math.random() * herbivores.length) | 0];
                d.stateTimer = 3.2 + Math.random() * 2.6;
              } else { d.state = 'wander'; d.stateTimer = 3 + Math.random() * 3; }
            } else {
              d.state = 'wander';
              d.stateTimer = 2.5 + Math.random() * 4;
              d.targetLane = (Math.random() * 2 - 1) * 0.85;
            }
          }

          let speedMul = 1;
          if (isTrex) {
            if (d.state === 'chase' && d.chaseTarget) {
              const gap = wrapAngle(d.chaseTarget.theta - d.theta);
              d.theta += Math.sign(gap) * Math.min(Math.abs(gap), d.angSpeed * 1.65 * dt);
              d.targetLane = d.chaseTarget.lane;
              speedMul = 1.25;
              if (d.jawPivot) d.jawPivot.rotation.x = 0.45 + Math.sin(t * 9) * 0.25;
            } else if (d.jawPivot) {
              d.jawPivot.rotation.x += (0.06 - d.jawPivot.rotation.x) * Math.min(1, dt * 5);
            }
          } else {
            const gapRex = wrapAngle(d.theta - tRexDino.theta);
            if (tRexDino.state === 'chase' && Math.abs(gapRex) < 0.9 && d.state !== 'flee') {
              d.state = 'flee'; d.stateTimer = 1.6 + Math.random() * 1.4;
            }
            if (d.state === 'flee') speedMul = 1.9;
          }

          d.theta += d.dir * d.angSpeed * speedMul * dt;
          d.lane += (d.targetLane - d.lane) * Math.min(1, dt * 2.2);
          const wob = Math.sin(t * 0.7 + d.phase) * 0.05;
          const pt = sampleMeadowTrack(d.theta + wob, d.lane);
          d.nx = pt.nx; d.nz = pt.nz;
          const ahead = sampleMeadowTrack(d.theta + wob + d.dir * 0.05, d.lane);
          d.yaw += wrapAngle(Math.atan2(ahead.nx - d.nx, ahead.nz - d.nz) - d.yaw) * Math.min(1, dt * 6);
          d.root.position.set(d.nx * R_DISC, 1.85 + evalSurf(d.nx, d.nz).height + 0.004, d.nz * R_DISC);
          d.root.rotation.y = d.yaw;

          d.walk = (d.walk || 0) + dt * d.stride * speedMul;
          d.legs.forEach((lg, li) => { lg.rotation.x = Math.sin(d.walk + (li % 2) * Math.PI) * 0.5; });
          if (d.neckPivot) d.neckPivot.rotation.x = Math.sin(d.walk * 0.5) * 0.06;
          if (d.tailPivot) d.tailPivot.rotation.y = Math.sin(d.walk * 0.5 + 1.1) * 0.16;
          if (d.bodyGrp) d.bodyGrp.position.y = 0.082 + Math.sin(d.walk * 2) * 0.004;
        }

        // Amber tracking ring under the followed land dino
        const followed = followDinoKey ? dinoMap[followDinoKey] : null;
        if (followed && followed.theta !== undefined) {
          trackRingMesh.visible = true;
          trackRingMesh.position.set(followed.nx * R_DISC, followed.root.position.y + 0.012, followed.nz * R_DISC);
          trackRingMat.opacity = 0.55 + Math.sin(t * 4) * 0.2;
          const rs = 1 + Math.sin(t * 4) * 0.05;
          trackRingMesh.scale.set(rs, 1, rs);
        } else {
          trackRingMesh.visible = false;
        }
  
        // Mosasaurus: ocean patrol + periodic breach with splash
        const ms = mosaState;
        if (ms.active) {
          ms.progress += dt / ms.duration;
          const mp = clamp(ms.progress, 0, 1);
          const arcU = (ms.uStart + ms.jumpDeltaU * mp) % 1;
          const bPos = oceanLoopCurve.getPointAt(arcU);
          mosa.root.position.set(bPos.x, bPos.y + Math.sin(mp * Math.PI) * 0.46, bPos.z);
          const bTan = oceanLoopCurve.getTangentAt(arcU);
          mosa.root.rotation.y = Math.atan2(bTan.x, bTan.z);
          mosa.root.rotation.x = -Math.cos(mp * Math.PI) * 0.55;
          if (mosa.jawPivot) mosa.jawPivot.rotation.x = Math.sin(mp * Math.PI) * 0.5;
          if (!ms.entrySplashTriggered && mp > 0.04) {
            ms.entrySplashTriggered = true;
            triggerWaterSplash(bPos.x, bPos.z, 1.0);
          }
          if (mp >= 1) {
            ms.active = false;
            ms.u = (ms.uStart + ms.jumpDeltaU) % 1;
            ms.timer = 3.4 + Math.random() * 4.5;
            triggerWaterSplash(bPos.x, bPos.z, 0.65);
          }
        } else {
          ms.timer -= dt;
          ms.u = (ms.u + ms.swimSpeed * dt) % 1;
          const bPos = oceanLoopCurve.getPointAt(ms.u);
          mosa.root.position.set(bPos.x, bPos.y + Math.sin(t * 1.7) * 0.012, bPos.z);
          const bTan = oceanLoopCurve.getTangentAt(ms.u);
          mosa.root.rotation.y = Math.atan2(bTan.x, bTan.z);
          mosa.root.rotation.x = Math.sin(t * 0.9) * 0.05;
          if (mosa.jawPivot) mosa.jawPivot.rotation.x = Math.max(0, Math.sin(t * 0.8)) * 0.12;
          if (ms.timer <= 0) { ms.active = true; ms.uStart = ms.u; ms.progress = 0; ms.entrySplashTriggered = false; }
        }
        const mSwim = t * 5.2;
        if (mosa.tail1Pivot) mosa.tail1Pivot.rotation.y = Math.sin(mSwim) * 0.35;
        if (mosa.tail2Pivot) mosa.tail2Pivot.rotation.y = Math.sin(mSwim + 0.6) * 0.5;
        if (mosa.flippers) mosa.flippers.forEach((f, fi) => { f.grp.rotation.z = Math.sin(mSwim + fi * 1.3) * 0.4 * f.dir; });

        // Water splash particles + expanding rings
        if (splashActive) {
          splashElapsed += dt;
          for (let i = 0; i < splashCount; i++) {
            const sv = splashVels[i];
            sv.y -= 2.4 * dt;
            splashPosArr[i * 3] += sv.x * dt;
            splashPosArr[i * 3 + 1] += sv.y * dt;
            splashPosArr[i * 3 + 2] += sv.z * dt;
          }
          splashGeo.attributes.position.needsUpdate = true;
          splashMat.opacity = Math.max(0, 0.95 * (1 - splashElapsed / 1.15));
          splashRings.forEach(r => {
            const rn = (splashElapsed - r.delay) / 0.65;
            if (rn <= 0 || rn >= 1) { r.mat.opacity = 0; return; }
            r.mesh.scale.setScalar(0.2 + rn * 2.6);
            r.mat.opacity = (1 - rn) * 0.8 * splashIntensity;
          });
          if (splashElapsed > 1.25) {
            splashActive = false; splashMat.opacity = 0;
            splashRings.forEach(r => { r.mat.opacity = 0; });
          }
        }

        // Pterodactylus: soaring orbit with flapping wings
        ptero.orbitAngle += dt * 0.5;
        const paA = ptero.orbitAngle;
        const prR = 1.12 + Math.sin(t * 0.37) * 0.10;
        const px = Math.cos(paA) * prR, pz = Math.sin(paA) * prR;
        ptero.root.position.set(px, 2.72 + Math.sin(t * 0.83) * 0.14, pz);
        const ax = Math.cos(paA + 0.06) * prR, az = Math.sin(paA + 0.06) * prR;
        ptero.root.rotation.y = Math.atan2(ax - px, az - pz);
        ptero.root.rotation.z = Math.sin(paA) * 0.2;
        const flap = Math.sin(t * 6.5);
        if (ptero.wingLPivot) ptero.wingLPivot.rotation.z = flap * 0.55;
        if (ptero.wingRPivot) ptero.wingRPivot.rotation.z = -flap * 0.55;
        if (ptero.headGrp) ptero.headGrp.rotation.x = Math.sin(t * 3.1) * 0.05;

        // Camera: scripted flight -> dino follow-tracking -> damped orbit
        if (flight) {
          flight.t += dt;
          const fp = clamp(flight.t / flight.duration, 0, 1);
          const fe = easeInOutCubic(fp);
          // Keep the destination glued to the dino's live position so the
          // camera lands beside it, not where it stood when the flight began.
          const fDino = followDinoKey ? dinoMap[followDinoKey] : null;
          if (fDino) {
            fDino.root.getWorldPosition(_v1);
            flight.toPos.copy(_v1).add(followOffset);
            flight.toTarget.copy(_v1);
          }
          camera.position.lerpVectors(flight.fromPos, flight.toPos, fe);
          controls.target.lerpVectors(flight.fromTarget, flight.toTarget, fe);
          if (fp >= 1) {
            flight = null;
            if (fDino) lastFollowPos.copy(_v1);
            else if (followDinoKey && dinoMap[followDinoKey]) dinoMap[followDinoKey].root.getWorldPosition(lastFollowPos);
          }
        } else if (followDinoKey && dinoMap[followDinoKey]) {
          dinoMap[followDinoKey].root.getWorldPosition(_v1);
          _v2.copy(_v1).sub(lastFollowPos);
          camera.position.add(_v2);
          controls.target.add(_v2);
          lastFollowPos.copy(_v1);
        }
        controls.update();

        renderer.render(scene, camera);
      }

      // ================= ARTIKEL ILMIAH (overlay, pola BAB 02) =================
      const articleOverlayEl = document.getElementById('articleOverlay');
      const tpArtBodyEl = document.getElementById('tpArtBody');

      function tpEscHTML(v) {
        return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function tpProfileSection(dataset, key, tagText) {
        const d = dataset[key][lang];
        const metrics = (d.metrics || []).map(m => `<div class="tp-art-metric"><div class="l">${tpEscHTML(m.l)}</div><div class="v">${tpEscHTML(m.v)}</div></div>`).join('');
        const subs = (d.subs || []).map(sb => `<div class="tp-art-sub"><div class="n">${tpEscHTML(sb.n)}</div><div class="m">${tpEscHTML(sb.m)}</div><div class="d">${tpEscHTML(sb.d)}</div></div>`).join('');
        return `
          <section class="tp-art-sec">
            <div class="tp-art-tag"><span>${tpEscHTML(tagText)}</span></div>
            <div class="tp-art-eyebrow">${tpEscHTML(d.eyebrow)}</div>
            <h3 class="tp-art-title">${tpEscHTML(d.title)}</h3>
            <p class="tp-art-desc">${tpEscHTML(d.desc)}</p>
            <div class="tp-art-metrics">${metrics}</div>
            <div class="tp-art-subhead">${tpEscHTML(d.subHeading)}</div>
            ${subs}
          </section>`;
      }

      function renderArticle() {
        const s = UI_STRINGS[lang];
        document.getElementById('tpArtEyebrow').textContent = s.articleBtn;
        document.getElementById('tpArtTitle').textContent = s.sub;
        const groupLayers = lang === 'id' ? 'PROFIL LAPISAN BUMI' : 'EARTH LAYER PROFILES';
        const groupFauna = lang === 'id' ? 'PROFIL FAUNA PRASEJARAH' : 'PREHISTORIC FAUNA PROFILES';
        const layerTag = lang === 'id' ? 'PROFIL LAPISAN' : 'LAYER PROFILE';
        const faunaTag = lang === 'id' ? 'PROFIL FAUNA' : 'FAUNA PROFILE';
        const introTag = lang === 'id' ? '01 // PENGANTAR' : '01 // INTRODUCTION';
        let artIndex = 2;
        let html = `
          <section class="tp-art-sec">
            <div class="tp-art-tag"><span>${tpEscHTML(introTag)}</span></div>
            <h3 class="tp-art-title">${tpEscHTML(s.sub)}</h3>
            <p class="tp-art-desc">${tpEscHTML(s.articleIntro)}</p>
          </section>`;
        html += `<div class="tp-art-group">${tpEscHTML(groupLayers)}</div>`;
        LAYER_ORDER.forEach((k) => { html += tpProfileSection(LAYER_DATA, k, `${String(artIndex++).padStart(2, '0')} // ${layerTag}`); });
        html += `<div class="tp-art-group">${tpEscHTML(groupFauna)}</div>`;
        DINO_ORDER.forEach((k) => { html += tpProfileSection(DINO_DATA, k, `${String(artIndex++).padStart(2, '0')} // ${faunaTag}`); });
        tpArtBodyEl.innerHTML = html;
      }

      function tpSetArticleOpen(open) {
        if (open) renderArticle();
        articleOverlayEl.classList.toggle('open', open);
        articleOverlayEl.setAttribute('aria-hidden', open ? 'false' : 'true');
        document.body.style.overflow = open ? 'hidden' : '';
      }

      document.getElementById('openArticleOverlayBtn').addEventListener('click', () => tpSetArticleOpen(true));
      document.getElementById('closeArticleOverlayBtn').addEventListener('click', () => tpSetArticleOpen(false));
      articleOverlayEl.querySelectorAll('[data-overlay-close]').forEach(el => el.addEventListener('click', () => tpSetArticleOpen(false)));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && articleOverlayEl.classList.contains('open')) tpSetArticleOpen(false);
      });

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    };
  </script>
  <script>
    // Toggle bilah navigasi samping (sidebar) — sembunyikan / tampilkan
    (function () {
      var btn = document.getElementById('navHandleBtn');
      if (!btn) return;
      var root = document.documentElement;
      function apply(closed) {
        root.classList.toggle('nav-closed', closed);
        btn.setAttribute('aria-expanded', closed ? 'false' : 'true');
        btn.setAttribute('aria-label', closed ? 'Tampilkan navigasi bab' : 'Sembunyikan navigasi bab');
        btn.setAttribute('title', closed ? 'Tampilkan navigasi bab' : 'Sembunyikan navigasi bab');
        try { window.dispatchEvent(new Event('resize')); } catch (e) { }
      }
      var stored = null;
      try { stored = localStorage.getItem('tpNavClosed'); } catch (e) { }
      // Mobile (≤900px): drawer selalu mulai tertutup agar 3D terlihat penuh
      var isMobileNav = window.matchMedia('(max-width:900px)').matches;
      if (isMobileNav || stored === '1') apply(true);
      btn.addEventListener('click', function () {
        var closed = !root.classList.contains('nav-closed');
        apply(closed);
        try { localStorage.setItem('tpNavClosed', closed ? '1' : '0'); } catch (e) { }
      });
    })();
  </script>
</body>
